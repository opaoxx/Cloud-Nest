name: cloudnest

services:
  mysql:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    container_name: cloudnest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: cloudnest
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=100
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13309}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --host=127.0.0.1 --user=root --batch --skip-column-names --execute="SELECT 1"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    networks: [cloudnest]

  redis:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: cloudnest-redis
    restart: unless-stopped
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:-root}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
    entrypoint: ["/bin/sh", "/usr/local/bin/cloudnest-redis-entrypoint.sh"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16380}:6379"
    volumes:
      - redis_data:/data
      - ./redis/entrypoint.sh:/usr/local/bin/cloudnest-redis-entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --user "$$REDIS_USERNAME" --no-auth-warning ping | grep -qx PONG'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 128m
    networks: [cloudnest]

  minio:
    image: cloudnest/minio:RELEASE.2025-10-15T17-29-55Z-source
    build:
      context: ./minio
      args:
        GOPROXY: "${MINIO_GOPROXY:-https://goproxy.cn|https://proxy.golang.org|direct}"
    container_name: cloudnest-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rootroot}
      MINIO_BROWSER_REDIRECT_URL: "http://127.0.0.1:${MINIO_CONSOLE_PORT:-19001}"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    networks: [cloudnest]

networks:
  cloudnest:
    name: cloudnest-dev
    ipam:
      config:
        - subnet: "${CLOUDNEST_SUBNET:-10.253.81.0/24}"

volumes:
  mysql_data:
    name: cloudnest_mysql_data
  redis_data:
    name: cloudnest_redis_data
  minio_data:
    name: cloudnest_minio_data
