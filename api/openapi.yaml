      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CLIENT_SOURCE_FORBIDDEN
              message: 客户端类型或请求来源不被允许
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    InvalidLoginArgument:
      description: 登录 DTO 字段规则不满足时返回 HTTP 400 INVALID_ARGUMENT，details.field 指向首个错误字段，提示只含固定规则。顺序为 username、password、installation_id、device_name、platform、client_type，随后检查平台与类型组合（定位 platform）。字段缺失/null 在解析为空值后被拒绝；非字符串等解析错误仍用 InvalidJSONRequest。此响应不表示账号存在性或密码验证结果。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_ARGUMENT
              message: 用户名须为 1～64 个小写字母、数字或下划线
              details:
                field: username
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    InvalidJSONRequest:
      description: 显式调用 ReadJSON 的操作返回 HTTP 400，错误码 INVALID_ARGUMENT。正文必须是有效 UTF-8、单个 JSON 对象，字段和类型符合请求 DTO；拒绝未知字段、第二段 JSON 和尾随非空白内容。读取失败也返回固定公开提示，不回显原始输入。必填及业务规则另行校验。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_ARGUMENT
              message: JSON 格式、字段或字段类型不正确
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RequestBodyTooLarge:
      description: 显式调用 ReadJSON 的操作，实际 JSON 正文超过 1048576 字节（1 MiB）时返回 HTTP 413，包含尾随空白。按实际读取量限制，不只依赖 Content-Length；读取超限优先于 JSON 格式判断。不用于文件上传流。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: REQUEST_BODY_TOO_LARGE
              message: JSON 请求正文不能超过 1 MiB
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UploadContentTimedOut:
      description: HTTP 408，上传 HTTP 传输期限到达。查询任务确认当前进度后再决定是否重试。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UPLOAD_TIMEOUT
              message: 上传传输超时，请查询任务状态后重试
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UploadContentConflict:
      description: HTTP 409，任务阶段或期限不允许接收、当前接收权不可用、暂存对象已存在或接收名额占满。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            taskNotReady:
              value:
                error:
                  code: TASK_NOT_READY
                  message: 上传任务当前不可接收文件内容
                  details: null
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            taskBusy:
              value:
                error:
                  code: UPLOAD_BUSY
                  message: 上传任务正在处理中
                  details: null
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            receiverBusy:
              value:
                error:
                  code: UPLOAD_BUSY
                  message: 上传接收繁忙，请稍后重试
                  details: null
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UploadCompletionConflict:
      description: |
        HTTP 409，上传模式或当前任务阶段不满足完成条件，返回 TASK_NOT_READY。
        客户端可通过任务查询读取实际阶段与公开错误摘要。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: [TASK_NOT_READY]
          example:
            error:
              code: TASK_NOT_READY
              message: 上传任务当前不可完成
              details: null
            request_id: 48ee758a-0727-42de-ae7d-3bb33155e148
    UploadCancellationConflict:
      description: |
        HTTP 409。仍有有效执行租约返回 UPLOAD_BUSY。任务正在过期收尾、未开始取消且已经到期，
        或上传方式为 MULTIPART 时返回 TASK_NOT_READY。客户端可使用任务查询接口刷新状态。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            taskBusy:
              value:
                error:
                  code: UPLOAD_BUSY
                  message: 上传任务正在处理中
                  details: null
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            taskNotReady:
              value:
                error:
                  code: TASK_NOT_READY
                  message: 上传任务当前不可取消
                  details: null
                request_id: 48ee758a-0727-42de-ae7d-3bb33155e148
    UploadContentTooLarge:
      description: HTTP 413，任务声明超过单文件限制，已知正文长度与声明不符，或实际读到的大小与声明不符。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            fileTooLarge:
              value:
                error:
                  code: FILE_TOO_LARGE
                  message: 文件大小不能超过 16 MiB
                  details: null
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            knownLengthMismatch:
              value:
                error:
                  code: BODY_SIZE_MISMATCH
                  message: 请求正文长度与上传声明不一致
                  details: null
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            actualLengthMismatch:
              value:
                error:
                  code: BODY_SIZE_MISMATCH
                  message: 文件实际大小与声明不一致
                  details: null
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UploadContentStorageUnavailable:
      description: HTTP 503，对象存储暂时无法完成本次接收。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: STORAGE_UNAVAILABLE
              message: 存储服务暂时不可用
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UploadReceiverBusy:
      description: 同一进程的共享上传临时区已有三个在途接收调用时返回 HTTP 409。名额在文件创建及正文读取前领取，满额时立即拒绝。各接收调用在完成本次清理及失败登记后释放名额。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UPLOAD_BUSY
              message: 上传接收繁忙，请稍后重试
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UploadTempSpaceExhausted:
      description: 共享上传临时区的剩余预占预算不足以接收本次声明大小时，返回 HTTP 507。容量检查在文件创建及正文读取前完成，使用固定提示。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TEMP_SPACE_EXHAUSTED
              message: 上传临时空间不足，请稍后重试
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UploadContentChecksumMismatch:
      description: 完整接收且实际大小符合声明后，客户端提供的预期 SHA256 与实际内容摘要不一致时返回 HTTP 422。省略预期摘要时通过该比较，显式全零摘要仍参与比较。响应只包含固定提示。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CHECKSUM_MISMATCH
              message: 文件校验失败，请重新上传
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UploadContentActualSizeMismatch:
      description: 原始文件流按任务声明受限读取，正常到达 EOF 时实际字节偏短，或额外检测到至少一个字节时，返回固定 HTTP 413。大小错误先于后续存储写入和发布，读取/写入故障由对应错误流程处理。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BODY_SIZE_MISMATCH
              message: 文件实际大小与声明不一致
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UploadContentBodySizeMismatch:
      description: 上传内容请求的已知 Content-Length 与当前用户任务的 file_size 不一致时返回 HTTP 413。使用 net/http 解析后的 ContentLength，未知长度继续由实际读取阶段计数校验。错误在正文读取前交付。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BODY_SIZE_MISMATCH
              message: 请求正文长度与上传声明不一致
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UploadContentInvalidLength:
      description: 上传内容绑定时，已解析 ContentLength 小于 -1 属于无效长度元数据，返回固定 HTTP 400。该内部字段中 -1 表示未知长度，零及正值表示已知长度。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_ARGUMENT
              message: 请求正文长度无效
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UploadContentUnsupportedMediaType:
      description: 原始文件内容接收入口要求单个 application/octet-stream Content-Type，允许格式正确的媒体参数。Content-Encoding 可省略或为单个 identity。缺失、空值、重复或无效媒体类型以及压缩/多重编码返回 HTTP 415，校验先于租约准备和正文读取。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: 请求必须使用 application/octet-stream，且不压缩正文
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UnsupportedMediaType:
      description: 显式调用 ReadJSON 的操作，仅接受单个 application/json Content-Type，charset 可省略或为 UTF-8，Content-Encoding 可省略或为单个 identity；其他格式、重复或空头、压缩正文返回 HTTP 415。媒体类型检查先于正文读取。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: 请求必须使用 application/json，字符集为 UTF-8，且不压缩正文
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    CORSPreflight:
      description: 全局 OPTIONS 预检成功，HTTP 204 且无正文；支持的目标方法及头仅表示跨域策略许可，不意味着业务接口已实现。方法大小写敏感，头名称大小写不敏感，未声明请求头时可通过，显式空项和未知项拒绝。不设置 Access-Control-Max-Age，不执行 Handler 或依赖检查。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Access-Control-Allow-Origin:
          description: 与白名单完全匹配的单个请求来源，永远不使用通配符。
          schema:
            type: string
          example: http://127.0.0.1:5173
        Access-Control-Allow-Credentials:
          schema:
            type: string
            enum: ['true']
        Access-Control-Allow-Methods:
          schema:
            type: string
            enum: ['GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS']
        Access-Control-Allow-Headers:
          schema:
            type: string
            enum: ['Authorization, Content-Type, Idempotency-Key, X-CloudNest-Client, X-Request-ID']
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Vary:
          description: 至少包含 Origin、Access-Control-Request-Method、Access-Control-Request-Headers，保留其他已有区分条件；可能为多个头行。
          schema:
            type: string
    CORSForbidden:
      description: 来源或预检不被允许，HTTP 403；不返回 Access-Control 放行头，不回显原始来源、方法或头。浏览器脚本无法读取被拒响应，可在开发者工具核对状态和请求 ID。HEAD 不返回正文。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CORS_FORBIDDEN
              message: 请求来源或跨域预检不被允许
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    InternalError:
      description: 普通 panic 被恢复，或认证中间件遇到未分类内部故障、异常身份结果、取消或超时时返回 HTTP 500，不包含原始异常。响应已提交时仅中止后续处理。HEAD 响应无正文。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: 服务内部错误，请稍后重试
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RouteNotFound:
      description: 未匹配到请求方法与路径，HTTP 404；不是文件或其他业务资源不存在。无 Origin 或已允许来源的普通未注册方法沿用此响应；合法预检返回 204，来源或预检非法时优先返回 403。不自动跳转尾斜杠路径。HEAD 按 HTTP 语义不返回正文。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          description: 错误及其请求 ID 不应缓存。
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ROUTE_NOT_FOUND
              message: 未找到匹配的接口
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        业务写请求的单值幂等键，建议客户端生成 UUID，也支持符合字符规则的其他请求标识。
        首尾 HTTP 空格及制表符在解析时去除，键保留大小写。去空白后须为 1～128 字节可见 ASCII，逗号及内部空白拒绝。
        多个字段行以及合并后的逗号多值均返回固定 Idempotency-Key 字段错误。
        长度与模式约束针对解析后的键，后续幂等流程结合用户、版本化操作与请求摘要关联结果。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]{1,128}(?![\s\S])'
      example: 28ee758a-0727-42de-ae7d-3bb33155e148
    UploadTaskID:
      name: id
      in: path
      required: true
      description: |
        上传任务 ID，范围为 1～18446744073709551615，使用标准十进制字符串。
        路由解码后校验，零、前导零、符号、空白、小数、残留编码和溢出按 id 字段错误处理。
        字段提示为“上传任务 ID 须为 1～18446744073709551615 的标准十进制整数”。
        最多 20 位的数字仍须满足上述 uint64 上限，服务端执行范围检查。
        用户身份由 Bearer 认证提供，任务归属由后续服务检查。
      schema:
        $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
      example: '19'
    EntryID:
      name: id
      in: path
      required: true
      description: |
        目标文件或目录的 ID，范围为 1～18446744073709551615，使用标准十进制字符串。
        路由解码后校验，零、前导零、符号、空白、小数、残留编码和溢出按 id 字段错误处理。
        字段提示为“目录项 ID 须为 1～18446744073709551615 的标准十进制整数”。
        最多 20 位的数字仍须满足上述 uint64 上限，服务端执行范围检查。
        调用者身份由 Bearer 认证提供，目标归属和目录祖先可见性由后续业务流程检查。
      schema:
        $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
      example: '23'
    EntryListScope:
      name: scope
      in: query
      required: false
      description: |
        省略时为 directory，显式单个 all/starred 进入全局分页，recent 进入最近文件分页，支持 URL 编码后的键和值。
        空值、重复或其他范围定位 scope，完整查询编码错误定位 query。
      schema:
        type: string
        enum: [directory, all, starred, recent]
        default: directory
    EntryListParentID:
      name: parent_id
      in: query
      required: false
      description: |
        directory 要求单个非零 uint64 标准十进制 ID，根目录 ID 从资料接口取得。
        all/starred/recent 将 parent_id 作为额外字段处理，用户归属来自认证 Actor。
      schema:
        $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
      example: '12'
    EntryListSearch:
      name: q
      in: query
      required: false
      allowEmptyValue: true
      description: |
        all/starred/recent 接收单个有效 UTF-8 名称搜索文本，保留解码后的空白、Unicode 形式及特殊字符。
        directory 要求省略或单个空值，空搜索读取当前范围内的全部名称。
      schema:
        $ref: '#/components/parameters/GlobalEntrySearch/schema'
    EntryListKind:
      name: kind
      in: query
      required: false
      allowEmptyValue: true
      description: all/starred/recent 支持单个空值、folder 或公开小写文件类别，recent 的 folder 交集为空，directory 要求省略或单个空值。
      schema:
        $ref: '#/components/parameters/GlobalEntryKind/schema'
    EntryListSort:
      name: sort
      in: query
      required: false
      description: directory/all/starred 省略时为 modified_desc，all/starred 另支持单个 name_asc 或 size_desc，recent 省略时为 last_opened_desc，显式值须单个匹配相应范围。
      schema:
        type: string
        enum: [modified_desc, name_asc, size_desc, last_opened_desc]
    TrashListCursor:
      name: cursor
      in: query
      required: false
      allowEmptyValue: true
      description: |
        单个回收站列表游标，省略或显式空值表示首页，解码后最多 1024 字节。
        续页原样提交上一页的 next_cursor，由服务校验签名及当前用户的回收站排序位置。
      schema:
        type: string
        maxLength: 1024
        default: ''
    EntryListCursor:
      name: cursor
      in: query
      required: false
      allowEmptyValue: true
      description: |
        单个原始游标文本，省略或空值表示首页，名称排序解码后最多 2048 字节，其余排序最多 1024 字节。
        目录、全局、最近、名称及大小游标绑定各自实际范围、用户、排序及筛选，目录游标另绑定 parent_id。
      schema:
        type: string
        maxLength: 2048
        default: ''
    DirectoryParentID:
      name: parent_id
      in: query
      required: true
      description: |
        单个非零 uint64 标准十进制 ID，取自真实根目录或普通目录。
        缺失、重复、空值、零、前导零、符号、空白或溢出按 parent_id 字段错误处理。
      schema:
        $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
      example: '12'
    DirectoryCursor:
      name: cursor
      in: query
      required: false
      allowEmptyValue: true
      description: |
        单个游标原文，省略或显式空值表示首页。解码后的文本最多 1024 字节。
        查询 DTO 检查重复和长度，签名及当前用户/目录绑定交给分页服务。
      schema:
        type: string
        maxLength: 1024
        default: ''
    DirectoryLimit:
      $ref: '#/components/parameters/UserDeviceLimit'
    DirectoryScope:
      name: scope
      in: query
      required: false
      description: 当前目录查询范围，省略时为 directory，显式值须单个匹配。
      schema:
        type: string
        enum: [directory]
        default: directory
    DirectorySort:
      name: sort
      in: query
      required: false
      description: 当前目录默认排序，显式值须单个 modified_desc。
      schema:
        type: string
        enum: [modified_desc]
        default: modified_desc
    DirectorySearch:
      name: q
      in: query
      required: false
      allowEmptyValue: true
      description: 当前空搜索条件，省略或单个空值匹配当前查询与游标摘要。
      schema:
        type: string
        enum: ['']
        default: ''
    DirectoryKind:
      name: kind
      in: query
      required: false
      allowEmptyValue: true
      description: 当前空类型筛选，省略或单个空值匹配当前查询与游标摘要。
      schema:
        type: string
        enum: ['']
        default: ''
    NameEntryScope:
      name: scope
      in: query
      required: false
      description: 名称升序查询 DTO 的范围，省略时为 all，显式值须为单个 all 或 starred。
      schema:
        type: string
        enum: [all, starred]
        default: all
    NameEntrySort:
      name: sort
      in: query
      required: false
      description: 名称升序查询 DTO 的排序，省略时为 name_asc，显式值须单个匹配。
      schema:
        type: string
        enum: [name_asc]
        default: name_asc
    NameEntrySearch:
      $ref: '#/components/parameters/GlobalEntrySearch'
    NameEntryKind:
      $ref: '#/components/parameters/GlobalEntryKind'
    NameEntryCursor:
      name: cursor
      in: query
      required: false
      allowEmptyValue: true
      description: |
        单个名称游标原文，省略或显式空值表示首页，解码后最多 2048 字节。
        查询 DTO 检查重复和字节长度，分页服务校验签名、用户及查询绑定。
        额外字段沿用忽略策略，parent_id 和 user_id 等值作为额外字段处理。
      schema:
        type: string
        maxLength: 2048
        default: ''
    NameEntryLimit:
      $ref: '#/components/parameters/GlobalEntryLimit'
    SizeEntryScope:
      name: scope
      in: query
      required: false
      description: 大小降序查询 DTO 的范围，省略时为 all，显式值须为单个 all 或 starred。
      schema:
        type: string
        enum: [all, starred]
        default: all
    SizeEntrySort:
      name: sort
      in: query
      required: false
      description: 大小降序查询 DTO 的排序，省略时为 size_desc，显式值须单个匹配。
      schema:
        type: string
        enum: [size_desc]
        default: size_desc
    SizeEntrySearch:
      $ref: '#/components/parameters/GlobalEntrySearch'
    SizeEntryKind:
      $ref: '#/components/parameters/GlobalEntryKind'
    SizeEntryCursor:
      name: cursor
      in: query
      required: false
      allowEmptyValue: true
      description: |
        单个大小游标原文，省略或显式空值表示首页，解码后最多 1024 字节。
        查询 DTO 检查重复和字节长度，分页服务校验签名、用户及查询绑定。
        额外字段沿用忽略策略，parent_id 和 user_id 等值作为额外字段处理。
      schema:
        type: string
        maxLength: 1024
        default: ''
    SizeEntryLimit:
      $ref: '#/components/parameters/GlobalEntryLimit'
    RecentEntryScope:
      name: scope
      in: query
      required: false
      description: 最近使用查询 DTO 的范围，省略时为 recent，显式值须为单个 recent。正式列表通过显式 scope=recent 选择此范围。
      schema:
        type: string
        enum: [recent]
        default: recent
    RecentEntrySort:
      name: sort
      in: query
      required: false
      description: 最近使用查询 DTO 的排序，省略时为 last_opened_desc，显式值须单个匹配。
      schema:
        type: string
        enum: [last_opened_desc]
        default: last_opened_desc
    RecentEntrySearch:
      $ref: '#/components/parameters/GlobalEntrySearch'
    RecentEntryKind:
      name: kind
      in: query
      required: false
      allowEmptyValue: true
      description: 最近文件的单个小写分类，空值表示全部文件，folder 与最近文件范围求交后为空页。
      schema:
        $ref: '#/components/parameters/GlobalEntryKind/schema'
    RecentEntryCursor:
      name: cursor
      in: query
      required: false
      allowEmptyValue: true
      description: |
        单个最近使用游标原文，省略或显式空值表示首页，解码后最多 1024 字节。
        查询 DTO 检查重复和字节长度，分页服务校验签名、用户及查询绑定。
        额外字段沿用忽略策略，parent_id 和 user_id 等值作为额外字段处理。
      schema:
        type: string
        maxLength: 1024
        default: ''
    RecentEntryLimit:
      $ref: '#/components/parameters/GlobalEntryLimit'
    GlobalEntryScope:
      name: scope
      in: query
      required: false
      description: 全局查询 DTO 的范围，省略时为 all，显式值须为单个 all 或 starred。
      schema:
        type: string
        enum: [all, starred]
        default: all
    GlobalEntrySort:
      name: sort
      in: query
      required: false
      description: 全局查询 DTO 的排序，省略时为 modified_desc，显式值须单个匹配。
      schema:
        type: string
        enum: [modified_desc]
        default: modified_desc
    GlobalEntrySearch:
      name: q
      in: query
      required: false
      allowEmptyValue: true
      description: |
        单个有效 UTF-8 搜索文本，省略或单个空值表示全部名称。
        URL 解码后的空白、Unicode 形式及特殊字符保留，百分号和下划线按名称原文包含匹配。
        搜索原文参与游标筛选摘要，筛选变化时重新从首页查询。
      schema:
        type: string
        default: ''
      example: 学习%_
    GlobalEntryKind:
      name: kind
      in: query
      required: false
      allowEmptyValue: true
      description: 单个公开小写分类，空值表示全部类型，folder 为文件夹，其余为文件类别。
      schema:
        type: string
        enum: ['', folder, document, image, video, audio, archive, other]
        default: ''
    GlobalEntryCursor:
      name: cursor
      in: query
      required: false
      allowEmptyValue: true
      description: |
        单个全局游标原文，省略或显式空值表示首页，解码后最多 1024 字节。
        查询 DTO 检查重复和长度，分页服务校验签名、用户及查询绑定。
        全局查询 DTO 的额外字段采用忽略策略，parent_id 和 user_id 等值均作为额外字段处理。
      schema:
        type: string
        maxLength: 1024
        default: ''
    GlobalEntryLimit:
      $ref: '#/components/parameters/UserDeviceLimit'
    UserDeviceID:
      name: id
      in: path
      required: true
      description: |
        目标设备 ID，范围为 1～18446744073709551615，使用标准十进制字符串。
        路由解码后校验，零、前导零、符号、空白、小数和溢出按 id 字段错误处理。
        最多 20 位的数字仍须满足上述 uint64 上限，服务端执行范围检查。
        调用者身份由 Bearer 认证提供，目标归属由后续设备业务流程检查。
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: '^[1-9][0-9]{0,19}$'
      example: '13'
    UserDeviceBeforeID:
      name: before_id
      in: query
      required: false
      description: |
        单个标准十进制边界值，范围为 0～18446744073709551615。省略或显式 0 表示首页。
        后续页使用上一页末项设备 ID，查询读取 ID 小于该值的记录。
        使用准确的十进制写法，重复值、空值、前导零、符号或空白按 before_id 字段错误处理。
        最多 20 位的数字仍须满足上述 uint64 上限，服务端执行范围检查。
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: '^(0|[1-9][0-9]{0,19})$'
        default: '0'
      example: '13'
    UserDeviceLimit:
      name: limit
      in: query
      required: false
      description: |
        单个标准十进制整数，范围为 1～100，省略时为 50。
        重复值、空值、前导零、符号或空白按 limit 字段错误处理。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      example: 50
    UserSessionID:
      name: id
      in: path
      required: true
      description: |
        目标会话 ID，范围为 1～18446744073709551615，使用标准十进制字符串。
        路由解码后校验，零、前导零、符号、空白、小数和溢出按 id 字段错误处理。
        最多 20 位的数字仍须满足上述 uint64 上限，服务端执行范围检查。
        正式 DELETE /api/v1/sessions/{id} 使用该路径参数。
        调用者身份由 Bearer 认证提供，目标会话归属在已认证用户事务中检查。
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: '^[1-9][0-9]{0,19}$'
      example: '13'
    UserSessionBeforeID:
      name: before_id
      in: query
      required: false
      description: |
        单个标准十进制边界值，范围为 0～18446744073709551615。省略或显式 0 表示首页。
        后续页使用上一页末项会话 ID，查询读取 ID 小于该值的记录。
        使用准确的十进制写法，重复值、空值、前导零、符号或空白按 before_id 字段错误处理。
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: '^(0|[1-9][0-9]{0,19})$'
        default: '0'
      example: '13'
    UserSessionLimit:
      name: limit
      in: query
      required: false
      description: |
        单个标准十进制整数，范围为 1～100，省略时为 50。
        重复值、空值、前导零、符号、空白或小数按 limit 字段错误处理。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      example: 50
    WebRefreshCookie:
      name: cloudnest_refresh_token
      in: cookie
      required: false
      description: Web 模式须携带单个非空刷新 Cookie，原文作为敏感凭证处理。原生模式使用正文 refresh_token。
      schema:
        type: string
        minLength: 1
    LoginClient:
      name: X-CloudNest-Client
      in: header
      required: true
      description: 单个精确的 web 或 native，必须与已解析正文的 client_type 一致；不去空白或转换大小写，重复/列表/空值拒绝。供登录、刷新和退出操作共用。
      schema:
        type: string
        enum: [web, native]
      example: web
    LoginOrigin:
      name: Origin
      in: header
      required: false
      description: 条件规则：web 必须提供单个与白名单精确一致的来源，native 必须不带此头（显式空值/null 也拒绝）。不进行请求来源规范化或 Referer 回退，不能只凭客户端类型声明绕过规则。供登录、刷新和退出操作共用。
      schema:
        type: string
      example: http://127.0.0.1:5173
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 单个标准 36 字符 UUID v4，大小写均可，合法值规范为小写；缺失、无效或重复时生成新值，不导致请求失败。用于关联请求，不作为身份或幂等凭证。
      schema:
        type: string
      example: 28ee758a-0727-42de-ae7d-3bb33155e148
  headers:
    ClearedRefreshCookie:
      description: |
        Web 模式退出成功时清理 cloudnest_refresh_token。值为空，Path=/api/v1/auth，省略 Domain。
        Expires 为 Thu, 01 Jan 1970 00:00:01 GMT，Max-Age=0，HttpOnly，SameSite=Strict。
        Secure 沿用可信 CLOUDNEST_COOKIE_SECURE 配置。原生模式交付成功 JSON。
      schema:
        type: string
      example: 'cloudnest_refresh_token=; Path=/api/v1/auth; Expires=Thu, 01 Jan 1970 00:00:01 GMT; Max-Age=0; HttpOnly; SameSite=Strict'
    RefreshCookie:
      description: |
        Web 模式成功响应设置 cloudnest_refresh_token，原文与内部结果一致。
        Path=/api/v1/auth，HttpOnly，SameSite=Strict，省略 Domain 以使用当前主机。
        Expires 采用会话截止时间的 UTC 整秒值。Secure 由 CLOUDNEST_COOKIE_SECURE 显式选择，HTTP 开发默认 false，HTTPS 部署配置 true。
      schema:
        type: string
    BearerChallenge:
      description: 认证拒绝的 401 响应附带 Bearer 认证提示。
      schema:
        type: string
        enum: ['Bearer realm="cloudnest"']
    RetryAfter:
      description: delta-seconds 十进制等待秒数，由正 duration 向上取整且至少为 1；防御性处理非正值时也返回 1，不采用 HTTP 日期。允许来源的普通 CORS 响应显式暴露此头。当前限流核心通常给出不超过 60 秒的建议，在途或总容量变化时不承诺到期一定放行。
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 60
    RequestID:
      description: 本次请求最终使用的 UUID v4，与请求上下文保持一致。
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      example: 28ee758a-0727-42de-ae7d-3bb33155e148
