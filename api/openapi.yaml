openapi: 3.0.3
info:
  title: CloudNest API
  version: 0.1.0
  description: |
    当前契约包含系统检查、受保护的目录列表、当前用户资料、会话列表及撤销接口、设备列表、改名与撤销、登录、刷新及退出操作。
    无 Origin 请求沿用原流程；有 Origin 时必须是单个与 CLOUDNEST_ALLOWED_ORIGINS 完全一致的值。
    允许来源的普通响应（包括 404/500/503）附带明确的 Access-Control-Allow-Origin、
    Access-Control-Allow-Credentials: true、Access-Control-Expose-Headers: X-Request-ID, Retry-After。
    所有响应含 Vary: Origin；OPTIONS 还区分 Access-Control-Request-Method 和 Access-Control-Request-Headers。
    OPTIONS 携带 Origin 和 Access-Control-Request-Method 时执行全局预检，不调用接口；成功响应见
    components.responses.CORSPreflight，非法来源或预检见 components.responses.CORSForbidden。
    预检不校验具体路由是否已实现，不带预检方法头的 OPTIONS 仍按普通路由匹配。
    未匹配路由的 404 见 components.responses.RouteNotFound；可恢复且响应未提交的异常见 InternalError。
    关闭自动尾斜杠跳转，例如 /ping/ 先检查来源再返回 404。路径列表不增加虚构通配或测试端点。
    JSON 读取器的共享错误见 InvalidJSONRequest、RequestBodyTooLarge、UnsupportedMediaType；
    供显式调用读取器的 JSON 操作引用，当前系统检查和资料 GET 按各自读取流程处理。
    POST /api/v1/auth/login 使用 LoginRequest 与共享输入、来源、限流及凭证错误响应。
    登录来源策略已实现：两种模式均要求单个 X-CloudNest-Client，与正文 client_type 精确一致；
    web 必须携带单个白名单 Origin，native 必须不带 Origin。来源不合规见 ClientSourceForbidden；
    LoginClient 与 LoginOrigin 记录登录、刷新及退出操作共用的头契约。
    HTTP 登录限流适配器已实现；受限响应见 RateLimited/RetryAfter 共享组件。
    登录操作共用单进程失败限流器，系统检查与当前用户 GET 使用各自处理链。
    受保护路由可挂载认证中间件，使用 BearerAuth；共享失败响应见 AuthorizationRejected 和 AccountDisabled。
    GET /api/v1/me、GET /api/v1/sessions 和 GET /api/v1/devices 已挂载认证中间件，后续业务操作按需引用这些组件。
    UserSummary 与 UserProfileData 定义用户资料的共享响应数据，用户和根目录 ID 使用十进制字符串，
    三项字节计数使用 0 到 9007199254740991 的 JSON 整数。后续登录和当前用户操作按需引用。
    当前用户接口共享成功响应见 CurrentUserProfile，响应使用 no-store。
    LoginData/LoginResponse 记录后续登录成功响应，Web JSON 省略 refresh_token，原生响应包含刷新原文。
    登录成功交付方法已通过测试入口验证，共享响应见 LoginSucceeded，Web 使用受限路径的刷新 Cookie。
    登录处理函数已在启动时绑定真实查询、共享限流凭证适配器、资料及令牌服务。
    RefreshData/RefreshResponse 定义刷新成功的数据结构，Web JSON 包含访问令牌与剩余秒数，原生模式增加刷新原文。
    刷新成功交付方法已通过测试入口验证，共享响应见 RefreshSucceeded，Web 沿用认证路径的刷新 Cookie。
    RefreshRequest 定义刷新 JSON 输入，client_type 精确选择 web/native，原生模式提交非空刷新原文。
    刷新提取按模式取得原文，Web 要求单个非空 cloudnest_refresh_token Cookie，原生使用正文值。
    刷新处理函数已组合 JSON/字段/来源检查、原文提取、刷新凭证服务与成功交付，并通过测试路由验证。
    POST /api/v1/auth/refresh 已由启动入口装配真实服务，使用共享 JWT 签发器、来源配置及 Cookie 配置。
    LogoutData/LogoutResponse 定义退出成功数据，将已确认提交的撤销结果映射为 revoked=true 和请求 ID。
    退出成功交付方法已通过测试入口验证，共享响应见 LogoutSucceeded，Web 使用相同名称及认证路径清理刷新 Cookie。
    LogoutRequest 定义退出 JSON 输入，client_type 精确选择 web/native，供后续来源检查及交付选择使用。
    退出处理函数已组合 Actor、JSON/字段/来源检查、退出服务与成功交付，并通过带认证中间件的测试路由验证。
    POST /api/v1/auth/logout 已由启动入口装配真实授权及退出服务，撤销当前会话并按客户端模式交付结果。
    UserSessionSummary/UserSessionListData/UserSessionListResponse 定义会话列表响应，使用字符串 ID、UTC 微秒时间、Current 及分页字段。
    UserSessionBeforeID/UserSessionLimit 定义会话列表操作的查询参数，默认首页和每页 50 条，输入错误使用固定字段提示。
    会话列表查询解析完整 RawQuery，额外字段采用忽略策略。整体格式错误定位 query，参数错误定位 before_id 或 limit。
    会话列表处理函数已组合 Actor、查询参数、列表服务及响应 DTO，测试专用 GET 入口的共享成功响应见 UserSessionsListed。
    GET /api/v1/sessions 已由启动入口绑定真实授权与列表服务，支持分页、当前标记及历史状态读取。
    UserSessionID 定义正式撤销指定会话操作的路径参数，使用非零 uint64 的标准十进制字符串。
    RevokeSessionData/RevokeSessionResponse 定义指定会话撤销的成功数据，使用 revoked=true 与统一 data/request_id 外层。
    指定会话撤销成功交付方法已通过测试专用 DELETE 入口验证，共享响应见 RevokeSessionSucceeded。
    指定会话撤销处理函数已组合认证 Actor、路径解析、服务及成功交付，目标不存在的共享 404 见 TargetSessionNotFound。
    DELETE /api/v1/sessions/{id} 已由启动入口绑定共享授权及已认证用户事务，支持指定当前或其他会话及重复撤销。
    UserDeviceSummary/UserDeviceListData/UserDeviceListResponse 定义后续设备列表响应，使用字符串 ID、UTC 微秒时间、current 及分页字段。
    UserDeviceBeforeID/UserDeviceLimit 定义设备列表查询参数，默认首页和每页 50 条，额外字段采用忽略策略。
    设备与会话查询共用完整 RawQuery 解析及数字校验，整体格式错误定位 query，其后依次检查 before_id、limit。
    设备列表处理函数已组合 Actor、查询参数、列表服务及响应 DTO，测试专用 GET 入口的共享成功响应见 UserDevicesListed。
    GET /api/v1/devices 已由启动入口绑定共享授权与真实设备列表服务，支持分页、当前设备标记及历史状态读取。
    RenameDeviceRequest 定义后续修改设备名称的请求正文，name 复用登录设备名称的输入规则，字段错误定位 name。
    RenamedDeviceSummary/RenameDeviceData/RenameDeviceResponse 定义后续改名成功响应，使用 data.device 与 request_id，设备时间为 UTC 微秒值。
    设备改名成功交付方法已通过测试专用 PATCH 入口验证，共享成功响应见 RenameDeviceSucceeded。
    设备改名处理函数已组合 Actor、路径、名称正文、服务及交付，目标不存在的共享 404 见 TargetDeviceNotFound。
    PATCH /api/v1/devices/{id} 已由启动入口绑定共享授权、用户事务和真实改名服务，确认提交后返回更新设备。
    RevokeDeviceData/RevokeDeviceResponse 定义后续设备撤销成功响应，使用 revoked=true 和统一 data/request_id 外层。
    设备撤销成功交付方法已通过测试专用 DELETE 入口验证，共享成功响应见 RevokeDeviceSucceeded。
    设备撤销处理函数组合 Actor、设备路径、撤销服务及交付，目标不存在复用 TargetDeviceNotFound。
    DELETE /api/v1/devices/{id} 由启动入口绑定共享授权及用户事务，原子撤销设备和全部关联会话。
    UserDeviceID 定义后续设备操作的路径参数，使用非零 uint64 的标准十进制字符串，字段错误定位 id。
    DirectoryEntrySummary/DirectoryBreadcrumb/DirectoryPageData/DirectoryPageResponse 定义后续基础目录列表响应。
    目录列表使用 items、breadcrumbs、可空 next_cursor 和统一 data/request_id，ID 与 revision 为字符串。
    目录页成功交付方法通过测试专用 GET 入口验证，共享响应见 DirectoryPageListed。
    DirectoryParentID/DirectoryCursor/DirectoryLimit 定义当前目录列表输入，默认每页 50 条。
    当前查询条件为 directory、modified_desc 和空 q/kind，重复值及不匹配条件返回固定字段错误。
    目录页处理函数组合 Actor、查询 DTO、分页服务和交付，输入/游标错误见 DirectoryQueryRejected，不可见目录见 TargetEntryNotFound。
    GET /api/v1/entries 已由启动入口绑定共享授权、同请求只读快照及持久化主密钥派生的目录游标签名配置。
    EntryID 定义后续文件或目录操作的路径 id，路由解码后按非零 uint64 标准十进制校验。
    EntryDetailData/EntryDetailResponse 定义指定目录项的完整公开详情，kind 映射文件类别，来源设备及历史空值按实际数据返回。
servers:
  - url: http://127.0.0.1:18081
tags:
  - name: Entries
    description: 当前用户的文件与目录元数据。
  - name: Account
    description: 当前用户身份与资料。
  - name: System
    description: 无需登录的开发探测、进程存活与依赖就绪检查。
paths:
  /api/v1/entries:
    get:
      tags: [Entries]
      operationId: listDirectoryEntries
      summary: 分页读取当前用户可见目录的活动子项
      description: |
        Bearer JWT 和数据库授权通过后解析查询，parent_id 必填，根目录 ID 从 GET /api/v1/me 获取。
        当前支持 scope=directory、sort=modified_desc 和空 q/kind，省略时使用这些默认条件。
        父目录与祖先须属于当前用户且均为活动目录，路径及子项在同一只读快照内读取。
        子项按 modified_at、id 降序分页，limit 默认 50、上限 100，末页和空页的 next_cursor 为 null。
        首次请求省略 cursor 或传空值，后续请求原样使用返回游标，校验用户、父目录、排序与筛选范围。
        同一用户的有效会话可共用游标，沿用同一持久化签名配置重启后可继续使用。
        跨请求采用弱一致性分页，客户端按 ID 合并去重，查询条件变化时重新读取首页。
        不可见、跨账号或不存在的目标统一返回 ENTRY_NOT_FOUND，可见文件父项定位 parent_id 输入错误。
        当前交付基础 entry_type 元数据、真实根目录到当前目录的面包屑和可空下一页游标。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/DirectoryScope'
        - $ref: '#/components/parameters/DirectoryParentID'
        - $ref: '#/components/parameters/DirectorySearch'
        - $ref: '#/components/parameters/DirectoryKind'
        - $ref: '#/components/parameters/DirectorySort'
        - $ref: '#/components/parameters/DirectoryCursor'
        - $ref: '#/components/parameters/DirectoryLimit'
      responses:
        '200':
          $ref: '#/components/responses/DirectoryPageListed'
        '400':
          $ref: '#/components/responses/DirectoryQueryRejected'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/TargetEntryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{id}:
    delete:
      tags: [Account]
      operationId: revokeSession
      summary: 撤销当前用户的指定会话
      description: |
        Bearer JWT 和数据库授权通过后解析路径 id，使用已认证 Actor 进入用户事务复查并撤销目标。
        当前会话、同设备及其他设备会话均可作为自己的目标，已撤销的目标重复操作成功并保留首次时间。
        目标不存在或属于其他账号时返回同一 SESSION_NOT_FOUND 404，调用者会话失效使用认证错误。
        成功撤销当前会话后，该会话的访问与刷新凭证在后续请求中失效。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UserSessionID'
      responses:
        '200':
          $ref: '#/components/responses/RevokeSessionSucceeded'
        '400':
          description: 已认证请求的路径 id 格式或范围错误，INVALID_ARGUMENT，details.field 为 id。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/TargetSessionNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/devices/{id}:
    delete:
      tags: [Account]
      operationId: revokeDevice
      summary: 撤销当前用户的指定设备及关联会话
      description: |
        Bearer JWT 和数据库授权通过后解析路径 id，使用已认证 Actor 进入用户事务复查并撤销目标。
        当前或其他自有设备均可撤销，设备与其尚未撤销的全部会话一起提交。
        已撤销目标重复操作成功，保留首次撤销时间，并补齐尚未撤销的关联会话。
        目标不存在或属于其他账号时返回同一 DEVICE_NOT_FOUND 404，调用者失效使用认证错误。
        撤销当前设备后，该设备旧会话的访问与刷新凭证在后续请求中失效。
        再次使用正确账号密码登录可复用原设备 ID 并创建新会话，旧会话保持失效。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UserDeviceID'
      responses:
        '200':
          $ref: '#/components/responses/RevokeDeviceSucceeded'
        '400':
          description: 已认证请求的路径 id 格式或范围错误，INVALID_ARGUMENT，details.field 为 id。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/TargetDeviceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Account]
      operationId: renameDevice
      summary: 修改当前用户的指定设备名称
      description: |
        Bearer JWT 和数据库授权通过后，依次解析路径 id、读取 JSON 正文并校验 name。
        使用已认证 Actor 进入用户事务，复查当前身份和目标归属，确认提交后交付设备结果。
        当前及其他自有设备均可改名，已撤销目标保留撤销状态，同名重试保留原更新时间。
        目标不存在或属于其他账号时返回 DEVICE_NOT_FOUND 404，调用者失效使用认证错误。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UserDeviceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameDeviceRequest'
      responses:
        '200':
          $ref: '#/components/responses/RenameDeviceSucceeded'
        '400':
          description: 路径 id、名称或 JSON 输入错误，INVALID_ARGUMENT；字段校验定位 id 或 name，JSON 读取错误的 details 为 null。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/TargetDeviceNotFound'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/devices:
    get:
      tags: [Account]
      operationId: listUserDevices
      summary: 分页读取当前用户的设备列表
      description: |
        Bearer JWT 和数据库授权通过后解析 before_id/limit，按已认证 Actor.UserID 读取列表。
        按设备 ID 降序分页，响应使用 items/has_more，后续页取本页末项 ID 作为 before_id。
        current 表示本次请求的设备身份匹配，同设备多个会话共享设备项与当前标记。
        历史设备撤销和可空活动时间按查询结果返回。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UserDeviceBeforeID'
        - $ref: '#/components/parameters/UserDeviceLimit'
      responses:
        '200':
          $ref: '#/components/responses/UserDevicesListed'
        '400':
          description: 已认证请求的查询格式或字段错误，INVALID_ARGUMENT，details.field 为 query、before_id 或 limit。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions:
    get:
      tags: [Account]
      operationId: listUserSessions
      summary: 分页读取当前用户的会话列表
      description: |
        Bearer JWT 和数据库授权通过后解析 before_id/limit，按已认证 Actor.UserID 读取列表。
        按会话 ID 降序分页，响应使用 items/has_more，后续页取本页末项 ID 作为 before_id。
        current 表示本次请求的会话身份匹配，历史撤销、设备撤销和到期事实按查询结果返回。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UserSessionBeforeID'
        - $ref: '#/components/parameters/UserSessionLimit'
      responses:
        '200':
          $ref: '#/components/responses/UserSessionsListed'
        '400':
          description: 已认证请求的查询格式或字段错误，INVALID_ARGUMENT，details.field 为 query、before_id 或 limit。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [Account]
      operationId: logout
      summary: 撤销当前登录会话
      description: |
        Bearer 认证及数据库授权通过后，读取 client_type，检查客户端声明和请求来源，再进入用户事务撤销当前会话。
        退出目标由已认证 Actor 确定。事务提交后，该会话的访问凭证和刷新凭证受撤销状态约束。
        Web 成功响应清理刷新 Cookie，原生客户端根据成功 JSON 清理本地凭证。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/LoginClient'
        - $ref: '#/components/parameters/LoginOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/LogoutSucceeded'
        '400':
          description: 已认证请求的 JSON 读取或退出字段校验失败，INVALID_ARGUMENT，字段错误包含 details.field。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 使用 ACCOUNT_DISABLED、CLIENT_SOURCE_FORBIDDEN 或 CORS_FORBIDDEN 表达具体拒绝原因。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh:
    post:
      tags: [Account]
      operationId: refreshTokens
      summary: 轮换刷新凭证并签发访问令牌
      description: |
        使用刷新凭证及数据库会话状态完成本次认证，按 JSON/字段/来源检查、凭证提取、事务轮换和签发的顺序处理。
        Web 通过单个刷新 Cookie 提交原文，原生通过 JSON refresh_token 提交原文。
        每次成功轮换后旧刷新原文失效，客户端对刷新执行 single-flight。交付失败时按重新登录流程恢复。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/LoginClient'
        - $ref: '#/components/parameters/LoginOrigin'
        - $ref: '#/components/parameters/WebRefreshCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          $ref: '#/components/responses/RefreshSucceeded'
        '400':
          description: JSON 读取或刷新字段校验失败，INVALID_ARGUMENT，字段错误包含 details.field。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 使用 ACCOUNT_DISABLED、CLIENT_SOURCE_FORBIDDEN 或 CORS_FORBIDDEN 表达具体拒绝原因。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags: [Account]
      operationId: login
      summary: 登录并创建当前设备会话
      description: 按字段及来源校验、共享限流和凭证验证、资料查询、用户事务会话创建、令牌签发的顺序处理。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/LoginClient'
        - $ref: '#/components/parameters/LoginOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginSucceeded'
        '400':
          description: JSON 读取或登录字段校验失败，INVALID_ARGUMENT，字段校验失败包含 details.field。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 使用 ACCOUNT_DISABLED、CLIENT_SOURCE_FORBIDDEN 或 CORS_FORBIDDEN 表达具体拒绝原因。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      tags: [Account]
      operationId: getCurrentUser
      summary: 获取当前用户资料
      description: 校验 Bearer JWT 并查询账号、会话和设备状态，再读取当前用户的真实根目录与配额资料。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/CurrentUserProfile'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /ping:
    get:
      tags: [System]
      operationId: getPing
      summary: 开发探测
      description: 保留原有响应，供本地开发工具确认 HTTP 服务可响应。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: HTTP 服务可响应。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  message:
                    type: string
                    enum: [CloudNest API is running]
              example:
                message: CloudNest API is running
        '403':
          $ref: '#/components/responses/CORSForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      summary: 进程存活检查
      description: 表示 HTTP 服务可响应，请求处理不查询 MySQL 或存储；依赖可用性由后续就绪检查提供。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: HTTP 服务可响应。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
        '403':
          $ref: '#/components/responses/CORSForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: 依赖就绪检查
      description: 每次请求重新检查 MySQL 连接和已有 MinIO 桶访问，两项检查共享最多 5 秒，任一失败立即返回未就绪。只读检查，不返回底层错误或凭证。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 两项依赖检查均通过。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: 不缓存就绪结果。
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
              example:
                status: ready
        '503':
          description: 任一依赖检查失败、超时或请求取消，当前未就绪。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: 不缓存就绪结果，恢复后下次请求重新检查。
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [not_ready]
              example:
                status: not_ready
        '403':
          $ref: '#/components/responses/CORSForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 单个 Authorization 头携带 Bearer 凭证，先校验 JWT，再查询并复核账号、会话及设备状态，成功后传递 Actor。
  schemas:
    EntrySourceDeviceSummary:
      type: object
      nullable: true
      additionalProperties: false
      required: [id, name]
      description: 内容发布时的来源设备，全部信息缺失时为 null，历史记录中未知的字段单独为 null。
      properties:
        id:
          type: string
          nullable: true
          pattern: '^[1-9][0-9]{0,19}$'
          description: 非零 uint64 的标准十进制字符串，上限为 18446744073709551615。
        name:
          type: string
          nullable: true
          description: 发布时名称快照，保留原始空白与空字符串。
    EntryDetailData:
      type: object
      additionalProperties: false
      required: [id, parent_id, name, kind, size_bytes, revision, created_at, modified_at, updated_at, status, extension, mime_type, color_key, content_modified_at, source_device, starred, starred_at, last_opened_at]
      description: 可见文件或目录的完整详情，公开标识及版本使用字符串，所有可空字段明确返回 null。
      properties:
        id:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
        parent_id:
          type: string
          nullable: true
          pattern: '^[1-9][0-9]{0,19}$'
          description: 非零 uint64 父目录标识，真实根目录为 null，上限为 18446744073709551615。
        name:
          type: string
          description: 目录项原始名称，真实根目录为空字符串。
        kind:
          type: string
          enum: [folder, document, image, video, audio, archive, other]
          description: DIR 为 folder，FILE 根据已保存的 category 映射。
        size_bytes:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/size_bytes'
        revision:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/revision'
        created_at:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/created_at'
        modified_at:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/modified_at'
        updated_at:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/updated_at'
        status:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/status'
        extension:
          type: string
          nullable: true
          description: 原始扩展名提示，空文本与 null 分别保留。
        mime_type:
          type: string
          nullable: true
          description: 发布时保存的内容 MIME。
        color_key:
          type: string
          nullable: true
          description: 原始文件夹颜色键。
        content_modified_at:
          type: string
          nullable: true
          format: date-time
          description: 最近内容发布时间，UTC 微秒精度，年份为 1000～9999。
        source_device:
          $ref: '#/components/schemas/EntrySourceDeviceSummary'
        starred:
          type: boolean
          description: 当且仅当 starred_at 非 null 时为 true。
        starred_at:
          type: string
          nullable: true
          format: date-time
          description: 收藏时间，UTC 微秒精度，年份为 1000～9999。
        last_opened_at:
          type: string
          nullable: true
          format: date-time
          description: 最近成功授权访问时间，UTC 微秒精度，年份为 1000～9999。
    EntryDetailResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/EntryDetailData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          id: '23'
          parent_id: '12'
          name: 学习笔记.md
          kind: document
          size_bytes: 2048
          revision: '3'
          created_at: '2026-11-15T01:30:00.123456Z'
          modified_at: '2026-11-15T02:30:00.123456Z'
          updated_at: '2026-11-15T02:30:00.123456Z'
          status: ACTIVE
          extension: md
          mime_type: text/markdown
          color_key: null
          content_modified_at: '2026-11-15T01:30:00.123456Z'
          source_device:
            id: '19'
            name: '  发布时设备 🎮  '
          starred: true
          starred_at: '2026-11-15T02:30:00.123456Z'
          last_opened_at: '2026-11-15T03:30:00.123456Z'
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    DirectoryEntrySummary:
      type: object
      additionalProperties: false
      required: [id, parent_id, name, entry_type, size_bytes, revision, created_at, modified_at, updated_at, status]
      description: 当前基础目录项字段，来自同一快照的活动子项，时间为 UTC 微秒值。
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
          description: 非零 uint64 的标准十进制字符串，上限为 18446744073709551615。
        parent_id:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
        name:
          type: string
          minLength: 1
          description: 按数据库原文返回的子项展示名称。
        entry_type:
          type: string
          enum: [FILE, DIR]
        size_bytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 文件内容大小快照，目录为 0。
        revision:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
          description: 非零 uint64 版本的标准十进制字符串。
        created_at:
          type: string
          format: date-time
          description: UTC 创建时间，最多六位小数，年份为 1000～9999。
        modified_at:
          type: string
          format: date-time
          description: UTC 业务修改时间，最多六位小数，年份为 1000～9999。
        updated_at:
          type: string
          format: date-time
          description: UTC 记录更新时间，最多六位小数，年份为 1000～9999。
        status:
          type: string
          enum: [ACTIVE]
    DirectoryBreadcrumb:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
        name:
          type: string
          description: 目录真实名称，根目录保留空字符串。
    DirectoryPageData:
      type: object
      additionalProperties: false
      required: [items, breadcrumbs, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DirectoryEntrySummary'
        breadcrumbs:
          type: array
          minItems: 1
          maxItems: 33
          description: 从真实根目录到当前父目录排列。
          items:
            $ref: '#/components/schemas/DirectoryBreadcrumb'
        next_cursor:
          type: string
          nullable: true
          minLength: 1
          maxLength: 1024
          description: 下一页签名游标原文，末页和空页明确返回 null。
    DirectoryPageResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/DirectoryPageData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          items:
            - id: '23'
              parent_id: '12'
              name: 学习笔记.md
              entry_type: FILE
              size_bytes: 2048
              revision: '3'
              created_at: '2026-11-15T01:30:00.123456Z'
              modified_at: '2026-11-15T02:30:00.123456Z'
              updated_at: '2026-11-15T02:30:00.123456Z'
              status: ACTIVE
          breadcrumbs:
            - id: '11'
              name: ''
            - id: '12'
              name: 课程资料
          next_cursor: null
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UserDeviceSummary:
      type: object
      additionalProperties: false
      required: [id, name, platform, created_at, last_seen_at, revoked_at, current]
      description: 已经服务归属与分页检查的设备记录转换结果，保留历史状态和可空时间。
      properties:
        id:
          $ref: '#/components/schemas/LoginDeviceSummary/properties/id'
        name:
          $ref: '#/components/schemas/LoginDeviceSummary/properties/name'
        platform:
          $ref: '#/components/schemas/LoginDeviceSummary/properties/platform'
        created_at:
          type: string
          format: date-time
          description: UTC 设备创建时间，最多六位小数，UTC 年份为 1000～9999。
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: 可空 UTC 最近认证活动时间，最多六位小数，非空 UTC 年份为 1000～9999。
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: 可空 UTC 设备撤销时间，最多六位小数，非空 UTC 年份为 1000～9999。
        current:
          type: boolean
          description: 服务按本次请求 Actor.DeviceID 计算的当前设备标记，false 明确返回。
    UserDeviceListData:
      type: object
      additionalProperties: false
      required: [items, has_more]
      description: |
        本页最多 100 条，按设备 ID 降序排列。空页使用 items=[]，has_more=false。
        has_more=true 时，客户端取本页末项 ID 作为后续页边界。
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/UserDeviceSummary'
        has_more:
          type: boolean
          description: 查询时的后续页提示，false 明确返回。
    UserDeviceListResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/UserDeviceListData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          items:
            - id: '13'
              name: 学习设备
              platform: WEB
              created_at: '2026-11-13T00:00:00.123456Z'
              last_seen_at: null
              revoked_at: null
              current: true
          has_more: false
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UserSessionSummary:
      type: object
      additionalProperties: false
      required: [id, device, created_at, expires_at, last_seen_at, revoked_at, device_revoked_at, current]
      description: 已经服务归属与分页检查的会话记录转换结果，历史状态按事实交付。
      properties:
        id:
          $ref: '#/components/schemas/LoginSessionSummary/properties/id'
        device:
          $ref: '#/components/schemas/LoginDeviceSummary'
        created_at:
          type: string
          format: date-time
          description: UTC 会话创建时间，最多六位小数，UTC 年份为 1000～9999。
        expires_at:
          type: string
          format: date-time
          description: UTC 会话截止时间，最多六位小数，UTC 年份为 1000～9999，保留历史到期事实。
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: 可空 UTC 会话最近使用时间，最多六位小数，非空 UTC 年份为 1000～9999。
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: 可空 UTC 会话撤销时间，最多六位小数，非空 UTC 年份为 1000～9999。
        device_revoked_at:
          type: string
          format: date-time
          nullable: true
          description: 可空 UTC 设备撤销时间，最多六位小数，非空 UTC 年份为 1000～9999。
        current:
          type: boolean
          description: 服务按本次请求 Actor.SessionID 计算的当前会话标记，false 明确返回。
    UserSessionListData:
      type: object
      additionalProperties: false
      required: [items, has_more]
      description: |
        本页最多 100 条，按会话 ID 降序排列。空页使用 items=[]，has_more=false。
        has_more=true 时，客户端取本页末项 ID 作为后续页边界。
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/UserSessionSummary'
        has_more:
          type: boolean
          description: 查询时的后续页提示，false 明确返回。
    UserSessionListResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/UserSessionListData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          items:
            - id: '11'
              device: {id: '13', name: 学习设备, platform: WEB}
              created_at: '2026-11-13T00:00:00.123456Z'
              expires_at: '2026-11-13T01:00:00.123456Z'
              last_seen_at: null
              revoked_at: null
              device_revoked_at: null
              current: false
          has_more: false
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RenamedDeviceSummary:
      type: object
      additionalProperties: false
      required: [id, name, platform, created_at, last_seen_at, revoked_at]
      description: 改名事务确认提交后的设备展示字段，名称保留原文，可空时间明确交付 null。
      properties:
        id:
          $ref: '#/components/schemas/LoginDeviceSummary/properties/id'
        name:
          $ref: '#/components/schemas/LoginDeviceSummary/properties/name'
        platform:
          $ref: '#/components/schemas/LoginDeviceSummary/properties/platform'
        created_at:
          $ref: '#/components/schemas/UserDeviceSummary/properties/created_at'
        last_seen_at:
          $ref: '#/components/schemas/UserDeviceSummary/properties/last_seen_at'
        revoked_at:
          $ref: '#/components/schemas/UserDeviceSummary/properties/revoked_at'
    RenameDeviceData:
      type: object
      additionalProperties: false
      required: [device]
      properties:
        device:
          $ref: '#/components/schemas/RenamedDeviceSummary'
    RenameDeviceResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/RenameDeviceData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          device:
            id: '13'
            name: 学习电脑
            platform: WEB
            created_at: '2026-11-13T00:00:00.123456Z'
            last_seen_at: null
            revoked_at: null
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RenameDeviceRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        修改设备名称的请求 DTO。name 使用有效 UTF-8，长度为 1～100 个 Unicode 码点。
        不能全为空白或包含控制字符，保留提交的大小写、空白及 Unicode 原文。
        名称格式复用 LoginRequest.device_name 的规则，字段错误使用 name。
      properties:
        name:
          $ref: '#/components/schemas/LoginRequest/properties/device_name'
      example:
        name: 学习电脑
    LogoutRequest:
      type: object
      additionalProperties: false
      required: [client_type]
      description: |
        退出请求 DTO。client_type 精确选择 web/native，后续与单个 X-CloudNest-Client 请求头核对并检查来源。
        当前会话身份由认证流程提供的 Actor 确定。
      properties:
        client_type:
          type: string
          enum: [web, native]
          description: 请求客户端类型，使用准确小写值。
      example:
        client_type: web
    RevokeDeviceData:
      type: object
      additionalProperties: false
      required: [revoked]
      description: 设备及关联会话撤销事务确认提交后的成功数据。
      properties:
        revoked:
          type: boolean
          enum: [true]
          description: 目标设备及关联会话已处于撤销状态，事务已确认提交，包含重复撤销成功。
    RevokeDeviceResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/RevokeDeviceData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          revoked: true
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RevokeSessionData:
      type: object
      additionalProperties: false
      required: [revoked]
      description: 指定目标会话已处于撤销状态，用户事务确认提交后的成功数据。
      properties:
        revoked:
          type: boolean
          enum: [true]
          description: 目标已处于撤销状态，事务已确认提交，包含重复撤销成功。
    RevokeSessionResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/RevokeSessionData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          revoked: true
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    LogoutData:
      type: object
      additionalProperties: false
      required: [revoked]
      description: 当前会话撤销确认提交后的成功数据，Web 与原生客户端共用。
      properties:
        revoked:
          type: boolean
          enum: [true]
          description: 本次会话撤销已确认提交。
    LogoutResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/LogoutData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          revoked: true
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RefreshRequest:
      description: |
        刷新请求 DTO。Web 从 Cookie 取得凭证，正文 refresh_token 可省略、为空字符串或 null。
        原生模式须在正文提供非空 refresh_token，原文交给凭证服务继续校验格式及有效性。
        client_type 后续须与单个 X-CloudNest-Client 请求头一致，并经过来源检查。
      oneOf:
        - type: object
          additionalProperties: false
          required: [client_type]
          properties:
            client_type:
              type: string
              enum: [web]
            refresh_token:
              type: string
              nullable: true
              maxLength: 0
              writeOnly: true
          example:
            client_type: web
        - type: object
          additionalProperties: false
          required: [client_type, refresh_token]
          properties:
            client_type:
              type: string
              enum: [native]
            refresh_token:
              type: string
              minLength: 1
              writeOnly: true
          example:
            client_type: native
            refresh_token: example.refresh.token
    RefreshData:
      type: object
      additionalProperties: false
      required: [access_token, expires_in]
      description: |
        已提交且签发成功的刷新结果转换后的响应数据。
        Web 模式由后续 HTTP 交付层设置刷新 Cookie，原生模式在 JSON 中交付 refresh_token。
        expires_in 按响应计算时刻取剩余完整秒数，向下取整，未来不足一秒时为 0。
        client_type 须经请求及来源校验。
      properties:
        access_token:
          $ref: '#/components/schemas/LoginData/properties/access_token'
        expires_in:
          $ref: '#/components/schemas/LoginData/properties/expires_in'
        refresh_token:
          $ref: '#/components/schemas/LoginData/properties/refresh_token'
    RefreshResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/RefreshData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          access_token: example.access.token
          expires_in: 899
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    LoginDeviceSummary:
      type: object
      additionalProperties: false
      required: [id, name, platform]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: 完整非零 uint64 设备 ID 的十进制字符串。
        name:
          type: string
          description: 数据库中实际保留的设备名称。
        platform:
          type: string
          enum: [WEB, WINDOWS, ANDROID]
    LoginSessionSummary:
      type: object
      additionalProperties: false
      required: [id, device_id, expires_at]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: 完整非零 uint64 会话 ID 的十进制字符串。
        device_id:
          $ref: '#/components/schemas/LoginDeviceSummary/properties/id'
        expires_at:
          type: string
          format: date-time
          description: UTC 会话截止时间，最多六位小数，同时约束刷新凭证期限。
    LoginData:
      type: object
      additionalProperties: false
      required: [user, root_entry_id, quota_bytes, used_bytes, reserved_bytes, access_token, expires_in, device, session]
      description: |
        登录服务及资料服务成功后的响应数据。Web JSON 省略 refresh_token，原生模式输出该字段。
        expires_in 为响应计算时刻到访问令牌截止时刻的完整剩余秒数，向下取整，未来不足一秒时为 0。
        Web 刷新 Cookie 由后续 HTTP 交付层设置，客户端类型须通过登录字段及来源策略校验。
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        root_entry_id:
          $ref: '#/components/schemas/UserProfileData/properties/root_entry_id'
        quota_bytes:
          $ref: '#/components/schemas/UserProfileData/properties/quota_bytes'
        used_bytes:
          $ref: '#/components/schemas/UserProfileData/properties/used_bytes'
        reserved_bytes:
          $ref: '#/components/schemas/UserProfileData/properties/reserved_bytes'
        access_token:
          type: string
          minLength: 1
          description: 访问令牌原文，按敏感凭证交付。
        expires_in:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        device:
          $ref: '#/components/schemas/LoginDeviceSummary'
        session:
          $ref: '#/components/schemas/LoginSessionSummary'
        refresh_token:
          type: string
          minLength: 1
          description: 仅原生模式在 JSON 中交付，Web 模式省略。
    LoginResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/LoginData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          user: {id: '1', username: root, display_name: 学习用户}
          root_entry_id: '1'
          quota_bytes: 107374182400
          used_bytes: 0
          reserved_bytes: 0
          access_token: example.access.token
          expires_in: 899
          device: {id: '3', name: 学习设备, platform: WEB}
          session: {id: '5', device_id: '3', expires_at: '2026-12-12T08:00:00Z'}
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UserProfileResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      description: 当前用户资料的成功响应，request_id 与响应头一致。
      properties:
        data:
          $ref: '#/components/schemas/UserProfileData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, username, display_name]
      description: 用户资料服务返回的用户展示信息，账号状态由服务复查。
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: 完整非零 uint64 用户 ID 的十进制字符串。
          example: '1'
        username:
          type: string
          description: 数据库中的用户登录名，按原文返回。
          example: root
        display_name:
          type: string
          description: 按原文返回，空字符串也明确输出。
          example: 学习用户
    UserProfileData:
      type: object
      additionalProperties: false
      required: [user, root_entry_id, quota_bytes, used_bytes, reserved_bytes]
      description: |
        供后续登录资料和当前用户响应复用的数据对象，外层由具体响应提供 data 与 request_id。
        DTO 转换检查非零 ID 与各项字节数的安全范围，状态和配额一致性由资料服务及 Repository 检查。
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        root_entry_id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: 完整非零 uint64 根目录 ID 的十进制字符串。
          example: '1'
        quota_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          example: 107374182400
        used_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          example: 0
        reserved_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          example: 0
      example:
        user: {id: '1', username: root, display_name: 学习用户}
        root_entry_id: '1'
        quota_bytes: 107374182400
        used_bytes: 0
        reserved_bytes: 0
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, installation_id, device_name, platform, client_type]
      description: 登录输入字段，校验不修改原文，不查询账号或验证密码；客户端安装标识与类型不作为身份凭证。字段合格后，登录来源策略要求客户端头与 client_type 一致；web 另需白名单 Origin，native 不得带 Origin。已由 POST /api/v1/auth/login 使用。
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9_]{1,64}$'
          description: 与数据库一致的小写 ASCII 登录名，不自动去空白或转小写。
          example: root
        password:
          type: string
          minLength: 1
          maxLength: 72
          writeOnly: true
          x-max-utf8-bytes: 72
          description: 有效 UTF-8，实际长度 1～72 字节；maxLength 是字符级上界，服务端另按 UTF-8 字节复核。保留空白，不归一化；不在登录处强制注册密码强度。
        installation_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: 客户端生成并持久保存的标准小写 UUID v4，不接受其他版本或替代写法。
          example: 28ee758a-0727-42de-ae7d-3bb33155e148
        device_name:
          type: string
          minLength: 1
          maxLength: 100
          description: 1～100 个 Unicode 码点，不能全为空白或包含控制字符；允许中文和 emoji，保留原文。
          example: 学习用浏览器
        platform:
          type: string
          enum: [WEB, WINDOWS, ANDROID]
        client_type:
          type: string
          enum: [web, native]
          description: 必须与单个 X-CloudNest-Client 头精确一致；本声明不证明调用者身份。
      oneOf:
        - properties:
            client_type:
              enum: [web]
            platform:
              enum: [WEB]
        - properties:
            client_type:
              enum: [native]
            platform:
              enum: [WINDOWS, ANDROID]
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          description: 稳定的错误类别码。
        message:
          type: string
          description: 可向客户端公开的错误提示。
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: 可公开的补充信息，未提供时为 null。
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
  responses:
    DirectoryQueryRejected:
      description: |
        HTTP 400，查询格式/字段或文件父项使用 INVALID_ARGUMENT，签名/范围无效使用 INVALID_CURSOR。
        details.field 定位公开字段，返回固定提示，适用于当前普通目录列表。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_cursor:
              value:
                error:
                  code: INVALID_CURSOR
                  message: 目录分页游标无效，请重新查询
                  details:
                    field: cursor
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            file_parent:
              value:
                error:
                  code: INVALID_ARGUMENT
                  message: 父目录须为文件夹
                  details:
                    field: parent_id
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    TargetEntryNotFound:
      description: |
        HTTP 404，ENTRY_NOT_FOUND，目标缺失、跨账号或路径回收/清理中时返回同一公开响应。
        details 为 null，固定提示为目录项不存在。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ENTRY_NOT_FOUND
              message: 目录项不存在
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    TargetDeviceNotFound:
      description: |
        HTTP 404，DEVICE_NOT_FOUND，当前用户范围内未找到目标设备。
        目标不存在及属于其他账号时使用相同公开响应，details 为 null，由正式设备改名操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: DEVICE_NOT_FOUND
              message: 设备不存在
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    TargetSessionNotFound:
      description: |
        HTTP 404，SESSION_NOT_FOUND，当前用户范围内未找到目标会话。
        目标不存在及属于其他账号时使用相同公开响应，details 为 null，由正式撤销指定会话操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SESSION_NOT_FOUND
              message: 会话不存在
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RenameDeviceSucceeded:
      description: |
        设备改名成功 HTTP 200，使用 data.device 与本次请求 ID，响应采用 no-store 和 Pragma no-cache。
        由正式设备改名操作引用，提交确认后交付设备结果。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RenameDeviceResponse'
    RevokeDeviceSucceeded:
      description: |
        设备及关联会话撤销成功 HTTP 200，使用 revoked=true 与本次请求 ID，响应采用 no-store 和 Pragma no-cache。
        由正式 DELETE /api/v1/devices/{id} 操作引用，事务确认提交后交付结果。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevokeDeviceResponse'
    RevokeSessionSucceeded:
      description: |
        指定会话撤销成功 HTTP 200，使用 revoked=true 与本次请求 ID，响应采用 no-store 和 Pragma no-cache。
        由正式 DELETE /api/v1/sessions/{id} 操作引用，提交确认后交付结果。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevokeSessionResponse'
    DirectoryPageListed:
      description: |
        目录列表成功 HTTP 200，返回 items、breadcrumbs、可空 next_cursor 与请求 ID。
        响应使用 no-store 和 Pragma no-cache，供后续目录列表操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DirectoryPageResponse'
    UserDevicesListed:
      description: 设备列表读取成功 HTTP 200，使用 no-store 和 Pragma no-cache，由正式设备列表操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserDeviceListResponse'
    UserSessionsListed:
      description: 会话列表读取成功 HTTP 200，使用 no-store 和 Pragma no-cache，由正式会话列表操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSessionListResponse'
    LogoutSucceeded:
      description: |
        退出成功 HTTP 200，由正式退出操作引用。两种客户端共用 revoked=true 和请求 ID。
        Web 使用空值、过去期限及 Max-Age=0 清理刷新 Cookie，原生客户端收到成功响应后清理本地凭证。
        两种模式均使用 no-store 和 Pragma no-cache。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
        Set-Cookie:
          $ref: '#/components/headers/ClearedRefreshCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LogoutResponse'
    RefreshSucceeded:
      description: |
        刷新成功 HTTP 200，供后续刷新操作引用。Web 通过 Set-Cookie 交付轮换后的刷新原文。
        原生模式在 JSON 中交付 refresh_token。两种模式均使用 no-store 和 Pragma no-cache。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
        Set-Cookie:
          $ref: '#/components/headers/RefreshCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshResponse'
    LoginSucceeded:
      description: |
        登录成功 HTTP 200，由正式登录操作引用。Web 模式通过 Set-Cookie 交付刷新原文，JSON 省略该字段。
        原生模式在 JSON 中交付 refresh_token。两种模式均使用 no-store 和 Pragma no-cache。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
        Set-Cookie:
          $ref: '#/components/headers/RefreshCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginResponse'
    CurrentUserProfile:
      description: 当前用户资料处理函数成功时返回 HTTP 200，禁止缓存，供后续当前用户操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfileResponse'
          example:
            data:
              user: {id: '1', username: root, display_name: 学习用户}
              root_entry_id: '1'
              quota_bytes: 107374182400
              used_bytes: 0
              reserved_bytes: 0
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    AuthorizationRejected:
      description: |
        HTTP 401，统一错误正文，details 为 null。凭证缺失、格式错误、JWT 或刷新凭证无效、错误登录凭证或当前账号未找到使用 AUTH_REQUIRED；
        Access Token 过期使用 TOKEN_EXPIRED；会话未找到、会话到期、会话或设备撤销使用 SESSION_REVOKED。
        此共享组件供后续受保护业务操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        WWW-Authenticate:
          $ref: '#/components/headers/BearerChallenge'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              value:
                error: {code: AUTH_REQUIRED, message: 用户名或密码错误, details: null}
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            required:
              value:
                error: {code: AUTH_REQUIRED, message: 请登录后重试, details: null}
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            expired:
              value:
                error: {code: TOKEN_EXPIRED, message: 访问令牌已过期，请刷新后重试, details: null}
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            revoked:
              value:
                error: {code: SESSION_REVOKED, message: 登录会话已失效，请重新登录, details: null}
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    AccountDisabled:
      description: 授权服务确认账号已禁用时返回 HTTP 403，details 为 null，供后续受保护操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: ACCOUNT_DISABLED, message: 账号已被禁用, details: null}
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RateLimited:
      description: 登录限流准入被拒绝时返回 HTTP 429，凭证查询尚未执行。Retry-After 给出建议等待秒数，不保证等待后一定放行；IP/用户名分别累计失败与在途预留。此组件由登录操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: 登录尝试过于频繁，请稍后重试
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    ClientSourceForbidden:
      description: 登录字段合格后，客户端声明/来源不符合规则时返回 HTTP 403，不查询凭证。错误固定，不回显请求头或正文。允许的 Web 来源保留 CORS 放行头，因此页面可读取拒绝响应；未知 Origin 可能被外层 CORS 先拒绝为 CORS_FORBIDDEN。此组件由登录来源检查引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CLIENT_SOURCE_FORBIDDEN
              message: 客户端类型或请求来源不被允许
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    InvalidLoginArgument:
      description: 登录 DTO 字段规则不满足时返回 HTTP 400 INVALID_ARGUMENT，details.field 指向首个错误字段，提示只含固定规则。顺序为 username、password、installation_id、device_name、platform、client_type，随后检查平台与类型组合（定位 platform）。字段缺失/null 在解析为空值后被拒绝；非字符串等解析错误仍用 InvalidJSONRequest。此响应不表示账号存在性或密码验证结果。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_ARGUMENT
              message: 用户名须为 1～64 个小写字母、数字或下划线
              details:
                field: username
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    InvalidJSONRequest:
      description: 显式调用 ReadJSON 的操作返回 HTTP 400，错误码 INVALID_ARGUMENT。正文必须是有效 UTF-8、单个 JSON 对象，字段和类型符合请求 DTO；拒绝未知字段、第二段 JSON 和尾随非空白内容。读取失败也返回固定公开提示，不回显原始输入。必填及业务规则另行校验。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_ARGUMENT
              message: JSON 格式、字段或字段类型不正确
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RequestBodyTooLarge:
      description: 显式调用 ReadJSON 的操作，实际 JSON 正文超过 1048576 字节（1 MiB）时返回 HTTP 413，包含尾随空白。按实际读取量限制，不只依赖 Content-Length；读取超限优先于 JSON 格式判断。不用于文件上传流。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: REQUEST_BODY_TOO_LARGE
              message: JSON 请求正文不能超过 1 MiB
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UnsupportedMediaType:
      description: 显式调用 ReadJSON 的操作，仅接受单个 application/json Content-Type，charset 可省略或为 UTF-8，Content-Encoding 可省略或为单个 identity；其他格式、重复或空头、压缩正文返回 HTTP 415。媒体类型检查先于正文读取。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: 请求必须使用 application/json，字符集为 UTF-8，且不压缩正文
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    CORSPreflight:
      description: 全局 OPTIONS 预检成功，HTTP 204 且无正文；支持的目标方法及头仅表示跨域策略许可，不意味着业务接口已实现。方法大小写敏感，头名称大小写不敏感，未声明请求头时可通过，显式空项和未知项拒绝。不设置 Access-Control-Max-Age，不执行 Handler 或依赖检查。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Access-Control-Allow-Origin:
          description: 与白名单完全匹配的单个请求来源，永远不使用通配符。
          schema:
            type: string
          example: http://127.0.0.1:5173
        Access-Control-Allow-Credentials:
          schema:
            type: string
            enum: ['true']
        Access-Control-Allow-Methods:
          schema:
            type: string
            enum: ['GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS']
        Access-Control-Allow-Headers:
          schema:
            type: string
            enum: ['Authorization, Content-Type, Idempotency-Key, X-CloudNest-Client, X-Request-ID']
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Vary:
          description: 至少包含 Origin、Access-Control-Request-Method、Access-Control-Request-Headers，保留其他已有区分条件；可能为多个头行。
          schema:
            type: string
    CORSForbidden:
      description: 来源或预检不被允许，HTTP 403；不返回 Access-Control 放行头，不回显原始来源、方法或头。浏览器脚本无法读取被拒响应，可在开发者工具核对状态和请求 ID。HEAD 不返回正文。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CORS_FORBIDDEN
              message: 请求来源或跨域预检不被允许
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    InternalError:
      description: 普通 panic 被恢复，或认证中间件遇到未分类内部故障、异常身份结果、取消或超时时返回 HTTP 500，不包含原始异常。响应已提交时仅中止后续处理。HEAD 响应无正文。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: 服务内部错误，请稍后重试
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RouteNotFound:
      description: 未匹配到请求方法与路径，HTTP 404；不是文件或其他业务资源不存在。无 Origin 或已允许来源的普通未注册方法沿用此响应；合法预检返回 204，来源或预检非法时优先返回 403。不自动跳转尾斜杠路径。HEAD 按 HTTP 语义不返回正文。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          description: 错误及其请求 ID 不应缓存。
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ROUTE_NOT_FOUND
              message: 未找到匹配的接口
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
  parameters:
    EntryID:
      name: id
      in: path
      required: true
      description: |
        目标文件或目录的 ID，范围为 1～18446744073709551615，使用标准十进制字符串。
        路由解码后校验，零、前导零、符号、空白、小数、残留编码和溢出按 id 字段错误处理。
        字段提示为“目录项 ID 须为 1～18446744073709551615 的标准十进制整数”。
        最多 20 位的数字仍须满足上述 uint64 上限，服务端执行范围检查。
        调用者身份由 Bearer 认证提供，目标归属和目录祖先可见性由后续业务流程检查。
      schema:
        $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
      example: '23'
    DirectoryParentID:
      name: parent_id
      in: query
      required: true
      description: |
        单个非零 uint64 标准十进制 ID，取自真实根目录或普通目录。
        缺失、重复、空值、零、前导零、符号、空白或溢出按 parent_id 字段错误处理。
      schema:
        $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
      example: '12'
    DirectoryCursor:
      name: cursor
      in: query
      required: false
      allowEmptyValue: true
      description: |
        单个游标原文，省略或显式空值表示首页。解码后的文本最多 1024 字节。
        查询 DTO 检查重复和长度，签名及当前用户/目录绑定交给分页服务。
      schema:
        type: string
        maxLength: 1024
        default: ''
    DirectoryLimit:
      $ref: '#/components/parameters/UserDeviceLimit'
    DirectoryScope:
      name: scope
      in: query
      required: false
      description: 当前目录查询范围，省略时为 directory，显式值须单个匹配。
      schema:
        type: string
        enum: [directory]
        default: directory
    DirectorySort:
      name: sort
      in: query
      required: false
      description: 当前目录默认排序，显式值须单个 modified_desc。
      schema:
        type: string
        enum: [modified_desc]
        default: modified_desc
    DirectorySearch:
      name: q
      in: query
      required: false
      allowEmptyValue: true
      description: 当前空搜索条件，省略或单个空值匹配当前查询与游标摘要。
      schema:
        type: string
        enum: ['']
        default: ''
    DirectoryKind:
      name: kind
      in: query
      required: false
      allowEmptyValue: true
      description: 当前空类型筛选，省略或单个空值匹配当前查询与游标摘要。
      schema:
        type: string
        enum: ['']
        default: ''
    UserDeviceID:
      name: id
      in: path
      required: true
      description: |
        目标设备 ID，范围为 1～18446744073709551615，使用标准十进制字符串。
        路由解码后校验，零、前导零、符号、空白、小数和溢出按 id 字段错误处理。
        最多 20 位的数字仍须满足上述 uint64 上限，服务端执行范围检查。
        调用者身份由 Bearer 认证提供，目标归属由后续设备业务流程检查。
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: '^[1-9][0-9]{0,19}$'
      example: '13'
    UserDeviceBeforeID:
      name: before_id
      in: query
      required: false
      description: |
        单个标准十进制边界值，范围为 0～18446744073709551615。省略或显式 0 表示首页。
        后续页使用上一页末项设备 ID，查询读取 ID 小于该值的记录。
        使用准确的十进制写法，重复值、空值、前导零、符号或空白按 before_id 字段错误处理。
        最多 20 位的数字仍须满足上述 uint64 上限，服务端执行范围检查。
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: '^(0|[1-9][0-9]{0,19})$'
        default: '0'
      example: '13'
    UserDeviceLimit:
      name: limit
      in: query
      required: false
      description: |
        单个标准十进制整数，范围为 1～100，省略时为 50。
        重复值、空值、前导零、符号或空白按 limit 字段错误处理。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      example: 50
    UserSessionID:
      name: id
      in: path
      required: true
      description: |
        目标会话 ID，范围为 1～18446744073709551615，使用标准十进制字符串。
        路由解码后校验，零、前导零、符号、空白、小数和溢出按 id 字段错误处理。
        最多 20 位的数字仍须满足上述 uint64 上限，服务端执行范围检查。
        正式 DELETE /api/v1/sessions/{id} 使用该路径参数。
        调用者身份由 Bearer 认证提供，目标会话归属在已认证用户事务中检查。
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: '^[1-9][0-9]{0,19}$'
      example: '13'
    UserSessionBeforeID:
      name: before_id
      in: query
      required: false
      description: |
        单个标准十进制边界值，范围为 0～18446744073709551615。省略或显式 0 表示首页。
        后续页使用上一页末项会话 ID，查询读取 ID 小于该值的记录。
        使用准确的十进制写法，重复值、空值、前导零、符号或空白按 before_id 字段错误处理。
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: '^(0|[1-9][0-9]{0,19})$'
        default: '0'
      example: '13'
    UserSessionLimit:
      name: limit
      in: query
      required: false
      description: |
        单个标准十进制整数，范围为 1～100，省略时为 50。
        重复值、空值、前导零、符号、空白或小数按 limit 字段错误处理。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      example: 50
    WebRefreshCookie:
      name: cloudnest_refresh_token
      in: cookie
      required: false
      description: Web 模式须携带单个非空刷新 Cookie，原文作为敏感凭证处理。原生模式使用正文 refresh_token。
      schema:
        type: string
        minLength: 1
    LoginClient:
      name: X-CloudNest-Client
      in: header
      required: true
      description: 单个精确的 web 或 native，必须与已解析正文的 client_type 一致；不去空白或转换大小写，重复/列表/空值拒绝。供登录、刷新和退出操作共用。
      schema:
        type: string
        enum: [web, native]
      example: web
    LoginOrigin:
      name: Origin
      in: header
      required: false
      description: 条件规则：web 必须提供单个与白名单精确一致的来源，native 必须不带此头（显式空值/null 也拒绝）。不进行请求来源规范化或 Referer 回退，不能只凭客户端类型声明绕过规则。供登录、刷新和退出操作共用。
      schema:
        type: string
      example: http://127.0.0.1:5173
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 单个标准 36 字符 UUID v4，大小写均可，合法值规范为小写；缺失、无效或重复时生成新值，不导致请求失败。用于关联请求，不作为身份或幂等凭证。
      schema:
        type: string
      example: 28ee758a-0727-42de-ae7d-3bb33155e148
  headers:
    ClearedRefreshCookie:
      description: |
        Web 模式退出成功时清理 cloudnest_refresh_token。值为空，Path=/api/v1/auth，省略 Domain。
        Expires 为 Thu, 01 Jan 1970 00:00:01 GMT，Max-Age=0，HttpOnly，SameSite=Strict。
        Secure 沿用可信 CLOUDNEST_COOKIE_SECURE 配置。原生模式交付成功 JSON。
      schema:
        type: string
      example: 'cloudnest_refresh_token=; Path=/api/v1/auth; Expires=Thu, 01 Jan 1970 00:00:01 GMT; Max-Age=0; HttpOnly; SameSite=Strict'
    RefreshCookie:
      description: |
        Web 模式成功响应设置 cloudnest_refresh_token，原文与内部结果一致。
        Path=/api/v1/auth，HttpOnly，SameSite=Strict，省略 Domain 以使用当前主机。
        Expires 采用会话截止时间的 UTC 整秒值。Secure 由 CLOUDNEST_COOKIE_SECURE 显式选择，HTTP 开发默认 false，HTTPS 部署配置 true。
      schema:
        type: string
    BearerChallenge:
      description: 认证拒绝的 401 响应附带 Bearer 认证提示。
      schema:
        type: string
        enum: ['Bearer realm="cloudnest"']
    RetryAfter:
      description: delta-seconds 十进制等待秒数，由正 duration 向上取整且至少为 1；防御性处理非正值时也返回 1，不采用 HTTP 日期。允许来源的普通 CORS 响应显式暴露此头。当前限流核心通常给出不超过 60 秒的建议，在途或总容量变化时不承诺到期一定放行。
      schema:
        type: integer
