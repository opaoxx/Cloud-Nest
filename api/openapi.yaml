openapi: 3.0.3
info:
  title: CloudNest API
  version: 0.1.0
  description: 当前契约包含开发探测、存活和就绪检查接口，业务接口随后续教学步骤补充。全局未匹配路由的 404 结构见 components.responses.RouteNotFound；可恢复异常且尚未提交响应时返回统一 500，见 components.responses.InternalError。路径列表不增加虚构的通配或异常测试端点。
servers:
  - url: http://127.0.0.1:18081
tags:
  - name: System
    description: 无需登录的开发探测、进程存活与依赖就绪检查。
paths:
  /ping:
    get:
      tags: [System]
      operationId: getPing
      summary: 开发探测
      description: 保留原有响应，供本地开发工具确认 HTTP 服务可响应。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: HTTP 服务可响应。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  message:
                    type: string
                    enum: [CloudNest API is running]
              example:
                message: CloudNest API is running
        '500':
          $ref: '#/components/responses/InternalError'
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      summary: 进程存活检查
      description: 表示 HTTP 服务可响应，请求处理不查询 MySQL 或存储；依赖可用性由后续就绪检查提供。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: HTTP 服务可响应。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: 依赖就绪检查
      description: 每次请求重新检查 MySQL 连接和已有 MinIO 桶访问，两项检查共享最多 5 秒，任一失败立即返回未就绪。只读检查，不返回底层错误或凭证。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 两项依赖检查均通过。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: 不缓存就绪结果。
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
              example:
                status: ready
        '503':
          description: 任一依赖检查失败、超时或请求取消，当前未就绪。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: 不缓存就绪结果，恢复后下次请求重新检查。
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [not_ready]
              example:
                status: not_ready
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          description: 稳定的错误类别码。
        message:
          type: string
          description: 可向客户端公开的错误提示。
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: 可公开的补充信息，未提供时为 null。
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
  responses:
    InternalError:
      description: 普通 panic 被恢复且响应尚未提交时返回 HTTP 500，不包含原始异常。若状态或正文已发送，则不覆盖或追加错误 JSON，仅中止后续处理；HEAD 不返回正文。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: 服务内部错误，请稍后重试
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RouteNotFound:
      description: 未匹配到请求方法与路径，HTTP 404；不是文件或其他业务资源不存在。当前未注册方法沿用此响应，自动重定向仍按框架原有行为处理。HEAD 按 HTTP 语义不返回正文。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          description: 错误及其请求 ID 不应缓存。
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ROUTE_NOT_FOUND
              message: 未找到匹配的接口
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 单个标准 36 字符 UUID v4，大小写均可，合法值规范为小写；缺失、无效或重复时生成新值，不导致请求失败。用于关联请求，不作为身份或幂等凭证。
      schema:
        type: string
      example: 28ee758a-0727-42de-ae7d-3bb33155e148
  headers:
    RequestID:
      description: 本次请求最终使用的 UUID v4，与请求上下文保持一致。
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      example: 28ee758a-0727-42de-ae7d-3bb33155e148
