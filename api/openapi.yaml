  /api/v1/trash:
    get:
      tags: [Entries]
      operationId: listTrashedEntries
      summary: 分页读取当前用户的顶层回收项
      description: |
        服务启动时注册，供已登录用户查看回收站。
        Bearer 授权通过后读取 cursor、limit，符合查询编码的额外参数沿用列表接口的忽略策略。
        仅显示当前用户自身为 TRASHED 且从父目录至真实根目录均为活动目录的项目。
        具有 TRASHED、PURGING 或 PURGED 祖先的嵌套项从列表隐藏。
        按 deleted_at、id 双降序分页，候选、祖先链及原路径在同一只读快照内读取。
        原路径根据保留的 parent_id 沿当前父链生成，从真实根目录到原父目录，采用读取时的名称和位置。
        保留截止时间为 deleted_at 加 30 天。仍为 TRASHED 的到期项继续展示，进入清理状态后移出列表。
        limit 默认 50、上限 100。每次最多检查 1000 个候选，预算耗尽时允许短页或空页带下一页游标。
        续页使用最后消费的候选位置，候选耗尽时 next_cursor 为 null。页间采用弱一致性，客户端按 ID 合并去重。
        游标通过回收站列表专用签名绑定当前用户和排序位置。同一用户的有效会话可原样续读，持久化签名配置重启后可继续使用。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TrashListCursor'
        - $ref: '#/components/parameters/DirectoryLimit'
      responses:
        '200':
          $ref: '#/components/responses/TrashEntriesListed'
        '400':
          $ref: '#/components/responses/TrashListQueryRejected'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/trash/{id}/restore:
    post:
      tags: [Entries]
      operationId: restoreEntry
      summary: 按预期版本恢复当前用户的单个回收项
      description: |
        服务启动时注册，供已登录用户恢复回收项。
        1. Bearer 授权通过后，依次校验路径 id、Idempotency-Key、受限 JSON 及 expected_revision。在用户锁内复查账号、设备与会话。
        2. 首次执行时检查归属和状态，真实根目录禁止恢复。目标须为 TRASHED，且原父链中没有 PURGING 或 PURGED 项。仍处于 TRASHED 的到期项可恢复，直到清理开始。
        3. 持锁比对版本。优先选择完整活动路径上的原父目录。原父链含 TRASHED 目录时，可按目标 ID 恢复到用户真实根目录。
           恢复后的目录项及子树须符合 32 层限制。原位置无法容纳时尝试根目录，根目录仍无法容纳时返回 409。
        4. 按同用户同父目录的活动名称键判重，原名可用时保留。冲突时依次选择最小可用编号后缀，例如 学习笔记 (1).md。文件后缀放在末级扩展名之前，目录后缀放在名称末尾，必要时截短基名。
        5. 仅将选中项改为 ACTIVE，写入实际父目录和名称，清除 deleted_at，版本加一。对象引用、配额、文件偏好和后代自身状态保持。后代按恢复后的完整路径判断可见性。
        若清理先取得用户锁并提交 PURGING，恢复按目标不可用返回 404。异常父链、真实根目录缺失或版本无法递增时按内部错误处理并回滚。
        恢复更新与稳定 data.entry 快照在同一事务提交，幂等结果保留八天。同一用户、同一操作、同键同参数重试返回首次快照和本次 request_id。
        摘要绑定目标 id 和 expected_revision。同键不同参数或记录已到期返回 409。用新键重复恢复已经活动的项返回 404。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/EntryID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreEntryRequest'
      responses:
        '200':
          $ref: '#/components/responses/RestoreEntrySucceeded'
        '400':
          $ref: '#/components/responses/TrashEntryRejected'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 真实根目录禁止恢复返回 ROOT_OPERATION_FORBIDDEN，账号禁用和来源拒绝沿用共享错误。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/RestoreEntryNotFound'
        '409':
          $ref: '#/components/responses/RestoreEntryConflict'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/entries/{id}/trash:
    post:
      tags: [Entries]
      operationId: trashEntry
      summary: 按预期版本回收当前用户的文件或目录
      description: |
        服务启动时绑定此路由，并装配共享授权、MySQL 用户事务与回收快照编解码。
        1. Bearer 授权通过后，依次校验路径 id、Idempotency-Key、受限 JSON 及 expected_revision。用户事务复查账号、设备与会话。
        2. 首次执行时检查目标归属及完整祖先链，要求目标和祖先均为 ACTIVE。真实根目录禁止回收，随后比对目标版本。
        3. 仅将选中的目录项标记为 TRASHED，记录数据库 UTC 回收时间并将版本加一。保留 parent_id、对象引用、配额和文件偏好。
        原名称键保留，活动名称占用随状态释放。目录的后代保留各自状态，通过祖先检查从正常列表、详情和新的下载授权中隐藏。
        已签发的存储链接按原有效期处理。回收更新与稳定 data.entry 在同一事务内提交，幂等结果保存八天。
        同一用户同键同参数重试交付当时的 200 快照，关联当前 request_id。参数摘要绑定目标 id 和 expected_revision。
        同键不同参数或已到期的记录返回对应 409。使用新键再次回收已隐藏项按不可见目标返回 404。
        版本无法递增时按内部错误处理，回收事务回滚。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/EntryID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashEntryRequest'
      responses:
        '200':
          $ref: '#/components/responses/TrashEntrySucceeded'
        '400':
          $ref: '#/components/responses/TrashEntryRejected'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          $ref: '#/components/responses/RootEntryOperationForbidden'
        '404':
          $ref: '#/components/responses/TargetEntryNotFound'
        '409':
          $ref: '#/components/responses/TrashEntryConflict'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/entries/{id}/download:
    post:
      tags: [Entries]
      operationId: createEntryDownload
      summary: 为当前用户可见的文件签发短期下载或预览地址
      description: |
        服务启动时注册此接口，并装配共享授权、MySQL 下载目标与 MinIO 签名。
        1. Bearer 授权通过后解析目录项 id、受限 JSON、expected_revision 和 purpose。每次请求重新授权，无需 Idempotency-Key。
        2. 核对文件归属及完整祖先链可见性，比较目录项版本，再确认物理对象为 READY 且内容可用。只有满足预览规则的内容才可申请 preview。
        3. 签发固定到该对象键的 GET URL，已有存储版本定位时一并绑定。初始有效期为 15 分钟，成功授权按 60 秒窗口合并记录 last_opened_at。
        客户端使用返回的 URL 直接访问存储，可请求单段 Range。CloudNest Bearer 令牌仅用于授权接口。续签重新检查身份、可见性及版本，续传前须核对 object_id 仍指向原对象。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/EntryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDownloadRequest'
      responses:
        '200':
          $ref: '#/components/responses/CreateDownloadSucceeded'
        '400':
          description: INVALID_ARGUMENT。路径或可见目标为目录时定位 id，版本与用途错误分别定位 expected_revision 或 purpose。正文结构错误使用统一错误响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
