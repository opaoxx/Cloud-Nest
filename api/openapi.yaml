openapi: 3.0.3
info:
  title: CloudNest API
  version: 0.1.0
  description: |
    当前契约包含系统检查、受保护的当前用户资料接口与登录操作。
    无 Origin 请求沿用原流程；有 Origin 时必须是单个与 CLOUDNEST_ALLOWED_ORIGINS 完全一致的值。
    允许来源的普通响应（包括 404/500/503）附带明确的 Access-Control-Allow-Origin、
    Access-Control-Allow-Credentials: true、Access-Control-Expose-Headers: X-Request-ID, Retry-After。
    所有响应含 Vary: Origin；OPTIONS 还区分 Access-Control-Request-Method 和 Access-Control-Request-Headers。
    OPTIONS 携带 Origin 和 Access-Control-Request-Method 时执行全局预检，不调用接口；成功响应见
    components.responses.CORSPreflight，非法来源或预检见 components.responses.CORSForbidden。
    预检不校验具体路由是否已实现，不带预检方法头的 OPTIONS 仍按普通路由匹配。
    未匹配路由的 404 见 components.responses.RouteNotFound；可恢复且响应未提交的异常见 InternalError。
    关闭自动尾斜杠跳转，例如 /ping/ 先检查来源再返回 404。路径列表不增加虚构通配或测试端点。
    JSON 读取器的共享错误见 InvalidJSONRequest、RequestBodyTooLarge、UnsupportedMediaType；
    供显式调用读取器的 JSON 操作引用，当前系统检查和资料 GET 按各自读取流程处理。
    POST /api/v1/auth/login 使用 LoginRequest 与共享输入、来源、限流及凭证错误响应。
    登录来源策略已实现：两种模式均要求单个 X-CloudNest-Client，与正文 client_type 精确一致；
    web 必须携带单个白名单 Origin，native 必须不带 Origin。来源不合规见 ClientSourceForbidden；
    LoginClient 与 LoginOrigin 记录登录操作的头契约。
    HTTP 登录限流适配器已实现；受限响应见 RateLimited/RetryAfter 共享组件。
    登录操作共用单进程失败限流器，系统检查与当前用户 GET 使用各自处理链。
    受保护路由可挂载认证中间件，使用 BearerAuth；共享失败响应见 AuthorizationRejected 和 AccountDisabled。
    GET /api/v1/me 已挂载认证中间件，后续业务操作按需引用这些组件。
    UserSummary 与 UserProfileData 定义用户资料的共享响应数据，用户和根目录 ID 使用十进制字符串，
    三项字节计数使用 0 到 9007199254740991 的 JSON 整数。后续登录和当前用户操作按需引用。
    当前用户接口共享成功响应见 CurrentUserProfile，响应使用 no-store。
    LoginData/LoginResponse 记录后续登录成功响应，Web JSON 省略 refresh_token，原生响应包含刷新原文。
    登录成功交付方法已通过测试入口验证，共享响应见 LoginSucceeded，Web 使用受限路径的刷新 Cookie。
    登录处理函数已在启动时绑定真实查询、共享限流凭证适配器、资料及令牌服务。
    RefreshData/RefreshResponse 定义刷新成功的数据结构，Web JSON 包含访问令牌与剩余秒数，原生模式增加刷新原文。
    刷新成功交付方法已通过测试入口验证，共享响应见 RefreshSucceeded，Web 沿用认证路径的刷新 Cookie。
servers:
  - url: http://127.0.0.1:18081
tags:
  - name: Account
    description: 当前用户身份与资料。
  - name: System
    description: 无需登录的开发探测、进程存活与依赖就绪检查。
paths:
  /api/v1/auth/login:
    post:
      tags: [Account]
      operationId: login
      summary: 登录并创建当前设备会话
      description: 按字段及来源校验、共享限流和凭证验证、资料查询、用户事务会话创建、令牌签发的顺序处理。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/LoginClient'
        - $ref: '#/components/parameters/LoginOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginSucceeded'
        '400':
          description: JSON 读取或登录字段校验失败，INVALID_ARGUMENT，字段校验失败包含 details.field。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 使用 ACCOUNT_DISABLED、CLIENT_SOURCE_FORBIDDEN 或 CORS_FORBIDDEN 表达具体拒绝原因。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      tags: [Account]
      operationId: getCurrentUser
      summary: 获取当前用户资料
      description: 校验 Bearer JWT 并查询账号、会话和设备状态，再读取当前用户的真实根目录与配额资料。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/CurrentUserProfile'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /ping:
    get:
      tags: [System]
      operationId: getPing
      summary: 开发探测
      description: 保留原有响应，供本地开发工具确认 HTTP 服务可响应。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: HTTP 服务可响应。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  message:
                    type: string
                    enum: [CloudNest API is running]
              example:
                message: CloudNest API is running
        '403':
          $ref: '#/components/responses/CORSForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      summary: 进程存活检查
      description: 表示 HTTP 服务可响应，请求处理不查询 MySQL 或存储；依赖可用性由后续就绪检查提供。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: HTTP 服务可响应。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
        '403':
          $ref: '#/components/responses/CORSForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: 依赖就绪检查
      description: 每次请求重新检查 MySQL 连接和已有 MinIO 桶访问，两项检查共享最多 5 秒，任一失败立即返回未就绪。只读检查，不返回底层错误或凭证。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 两项依赖检查均通过。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: 不缓存就绪结果。
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
              example:
                status: ready
        '503':
          description: 任一依赖检查失败、超时或请求取消，当前未就绪。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: 不缓存就绪结果，恢复后下次请求重新检查。
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [not_ready]
              example:
                status: not_ready
        '403':
          $ref: '#/components/responses/CORSForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 单个 Authorization 头携带 Bearer 凭证，先校验 JWT，再查询并复核账号、会话及设备状态，成功后传递 Actor。
  schemas:
    RefreshData:
      type: object
      additionalProperties: false
      required: [access_token, expires_in]
      description: |
        已提交且签发成功的刷新结果转换后的响应数据。
        Web 模式由后续 HTTP 交付层设置刷新 Cookie，原生模式在 JSON 中交付 refresh_token。
        expires_in 按响应计算时刻取剩余完整秒数，向下取整，未来不足一秒时为 0。
        client_type 须经请求及来源校验。
      properties:
        access_token:
          $ref: '#/components/schemas/LoginData/properties/access_token'
        expires_in:
          $ref: '#/components/schemas/LoginData/properties/expires_in'
        refresh_token:
          $ref: '#/components/schemas/LoginData/properties/refresh_token'
    RefreshResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/RefreshData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          access_token: example.access.token
          expires_in: 899
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    LoginDeviceSummary:
      type: object
      additionalProperties: false
      required: [id, name, platform]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: 完整非零 uint64 设备 ID 的十进制字符串。
        name:
          type: string
          description: 数据库中实际保留的设备名称。
        platform:
          type: string
          enum: [WEB, WINDOWS, ANDROID]
    LoginSessionSummary:
      type: object
      additionalProperties: false
      required: [id, device_id, expires_at]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: 完整非零 uint64 会话 ID 的十进制字符串。
        device_id:
          $ref: '#/components/schemas/LoginDeviceSummary/properties/id'
        expires_at:
          type: string
          format: date-time
          description: UTC 会话截止时间，最多六位小数，同时约束刷新凭证期限。
    LoginData:
      type: object
      additionalProperties: false
      required: [user, root_entry_id, quota_bytes, used_bytes, reserved_bytes, access_token, expires_in, device, session]
      description: |
        登录服务及资料服务成功后的响应数据。Web JSON 省略 refresh_token，原生模式输出该字段。
        expires_in 为响应计算时刻到访问令牌截止时刻的完整剩余秒数，向下取整，未来不足一秒时为 0。
        Web 刷新 Cookie 由后续 HTTP 交付层设置，客户端类型须通过登录字段及来源策略校验。
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        root_entry_id:
          $ref: '#/components/schemas/UserProfileData/properties/root_entry_id'
        quota_bytes:
          $ref: '#/components/schemas/UserProfileData/properties/quota_bytes'
        used_bytes:
          $ref: '#/components/schemas/UserProfileData/properties/used_bytes'
        reserved_bytes:
          $ref: '#/components/schemas/UserProfileData/properties/reserved_bytes'
        access_token:
          type: string
          minLength: 1
          description: 访问令牌原文，按敏感凭证交付。
        expires_in:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        device:
          $ref: '#/components/schemas/LoginDeviceSummary'
        session:
          $ref: '#/components/schemas/LoginSessionSummary'
        refresh_token:
          type: string
          minLength: 1
          description: 仅原生模式在 JSON 中交付，Web 模式省略。
    LoginResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/LoginData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          user: {id: '1', username: root, display_name: 学习用户}
          root_entry_id: '1'
          quota_bytes: 107374182400
          used_bytes: 0
          reserved_bytes: 0
          access_token: example.access.token
          expires_in: 899
          device: {id: '3', name: 学习设备, platform: WEB}
          session: {id: '5', device_id: '3', expires_at: '2026-12-12T08:00:00Z'}
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UserProfileResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      description: 当前用户资料的成功响应，request_id 与响应头一致。
      properties:
        data:
          $ref: '#/components/schemas/UserProfileData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, username, display_name]
      description: 用户资料服务返回的用户展示信息，账号状态由服务复查。
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: 完整非零 uint64 用户 ID 的十进制字符串。
          example: '1'
        username:
          type: string
          description: 数据库中的用户登录名，按原文返回。
          example: root
        display_name:
          type: string
          description: 按原文返回，空字符串也明确输出。
          example: 学习用户
    UserProfileData:
      type: object
      additionalProperties: false
      required: [user, root_entry_id, quota_bytes, used_bytes, reserved_bytes]
      description: |
        供后续登录资料和当前用户响应复用的数据对象，外层由具体响应提供 data 与 request_id。
        DTO 转换检查非零 ID 与各项字节数的安全范围，状态和配额一致性由资料服务及 Repository 检查。
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        root_entry_id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: 完整非零 uint64 根目录 ID 的十进制字符串。
          example: '1'
        quota_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          example: 107374182400
        used_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          example: 0
        reserved_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          example: 0
      example:
        user: {id: '1', username: root, display_name: 学习用户}
        root_entry_id: '1'
        quota_bytes: 107374182400
        used_bytes: 0
        reserved_bytes: 0
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, installation_id, device_name, platform, client_type]
      description: 登录输入字段，校验不修改原文，不查询账号或验证密码；客户端安装标识与类型不作为身份凭证。字段合格后，登录来源策略要求客户端头与 client_type 一致；web 另需白名单 Origin，native 不得带 Origin。已由 POST /api/v1/auth/login 使用。
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9_]{1,64}$'
          description: 与数据库一致的小写 ASCII 登录名，不自动去空白或转小写。
          example: root
        password:
          type: string
          minLength: 1
          maxLength: 72
          writeOnly: true
          x-max-utf8-bytes: 72
          description: 有效 UTF-8，实际长度 1～72 字节；maxLength 是字符级上界，服务端另按 UTF-8 字节复核。保留空白，不归一化；不在登录处强制注册密码强度。
        installation_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: 客户端生成并持久保存的标准小写 UUID v4，不接受其他版本或替代写法。
          example: 28ee758a-0727-42de-ae7d-3bb33155e148
        device_name:
          type: string
          minLength: 1
          maxLength: 100
          description: 1～100 个 Unicode 码点，不能全为空白或包含控制字符；允许中文和 emoji，保留原文。
          example: 学习用浏览器
        platform:
          type: string
          enum: [WEB, WINDOWS, ANDROID]
        client_type:
          type: string
          enum: [web, native]
          description: 必须与单个 X-CloudNest-Client 头精确一致；本声明不证明调用者身份。
      oneOf:
        - properties:
            client_type:
              enum: [web]
            platform:
              enum: [WEB]
        - properties:
            client_type:
              enum: [native]
            platform:
              enum: [WINDOWS, ANDROID]
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          description: 稳定的错误类别码。
        message:
          type: string
          description: 可向客户端公开的错误提示。
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: 可公开的补充信息，未提供时为 null。
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
  responses:
    RefreshSucceeded:
      description: |
        刷新成功 HTTP 200，供后续刷新操作引用。Web 通过 Set-Cookie 交付轮换后的刷新原文。
        原生模式在 JSON 中交付 refresh_token。两种模式均使用 no-store 和 Pragma no-cache。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
        Set-Cookie:
          $ref: '#/components/headers/RefreshCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshResponse'
    LoginSucceeded:
      description: |
        登录成功 HTTP 200，由正式登录操作引用。Web 模式通过 Set-Cookie 交付刷新原文，JSON 省略该字段。
        原生模式在 JSON 中交付 refresh_token。两种模式均使用 no-store 和 Pragma no-cache。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
        Set-Cookie:
          $ref: '#/components/headers/RefreshCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginResponse'
    CurrentUserProfile:
      description: 当前用户资料处理函数成功时返回 HTTP 200，禁止缓存，供后续当前用户操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfileResponse'
          example:
            data:
              user: {id: '1', username: root, display_name: 学习用户}
              root_entry_id: '1'
              quota_bytes: 107374182400
              used_bytes: 0
              reserved_bytes: 0
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    AuthorizationRejected:
      description: |
        HTTP 401，统一错误正文，details 为 null。凭证缺失、格式错误、JWT 无效、错误登录凭证或当前账号未找到使用 AUTH_REQUIRED；
        Access Token 过期使用 TOKEN_EXPIRED；会话未找到、会话到期、会话或设备撤销使用 SESSION_REVOKED。
        此共享组件供后续受保护业务操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        WWW-Authenticate:
          $ref: '#/components/headers/BearerChallenge'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              value:
                error: {code: AUTH_REQUIRED, message: 用户名或密码错误, details: null}
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            required:
              value:
                error: {code: AUTH_REQUIRED, message: 请登录后重试, details: null}
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            expired:
              value:
                error: {code: TOKEN_EXPIRED, message: 访问令牌已过期，请刷新后重试, details: null}
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            revoked:
              value:
                error: {code: SESSION_REVOKED, message: 登录会话已失效，请重新登录, details: null}
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    AccountDisabled:
      description: 授权服务确认账号已禁用时返回 HTTP 403，details 为 null，供后续受保护操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: ACCOUNT_DISABLED, message: 账号已被禁用, details: null}
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RateLimited:
      description: 登录限流准入被拒绝时返回 HTTP 429，凭证查询尚未执行。Retry-After 给出建议等待秒数，不保证等待后一定放行；IP/用户名分别累计失败与在途预留。此组件由登录操作引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: 登录尝试过于频繁，请稍后重试
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    ClientSourceForbidden:
      description: 登录字段合格后，客户端声明/来源不符合规则时返回 HTTP 403，不查询凭证。错误固定，不回显请求头或正文。允许的 Web 来源保留 CORS 放行头，因此页面可读取拒绝响应；未知 Origin 可能被外层 CORS 先拒绝为 CORS_FORBIDDEN。此组件由登录来源检查引用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CLIENT_SOURCE_FORBIDDEN
              message: 客户端类型或请求来源不被允许
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    InvalidLoginArgument:
      description: 登录 DTO 字段规则不满足时返回 HTTP 400 INVALID_ARGUMENT，details.field 指向首个错误字段，提示只含固定规则。顺序为 username、password、installation_id、device_name、platform、client_type，随后检查平台与类型组合（定位 platform）。字段缺失/null 在解析为空值后被拒绝；非字符串等解析错误仍用 InvalidJSONRequest。此响应不表示账号存在性或密码验证结果。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_ARGUMENT
              message: 用户名须为 1～64 个小写字母、数字或下划线
              details:
                field: username
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    InvalidJSONRequest:
      description: 显式调用 ReadJSON 的操作返回 HTTP 400，错误码 INVALID_ARGUMENT。正文必须是有效 UTF-8、单个 JSON 对象，字段和类型符合请求 DTO；拒绝未知字段、第二段 JSON 和尾随非空白内容。读取失败也返回固定公开提示，不回显原始输入。必填及业务规则另行校验。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_ARGUMENT
              message: JSON 格式、字段或字段类型不正确
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RequestBodyTooLarge:
      description: 显式调用 ReadJSON 的操作，实际 JSON 正文超过 1048576 字节（1 MiB）时返回 HTTP 413，包含尾随空白。按实际读取量限制，不只依赖 Content-Length；读取超限优先于 JSON 格式判断。不用于文件上传流。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: REQUEST_BODY_TOO_LARGE
              message: JSON 请求正文不能超过 1 MiB
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UnsupportedMediaType:
      description: 显式调用 ReadJSON 的操作，仅接受单个 application/json Content-Type，charset 可省略或为 UTF-8，Content-Encoding 可省略或为单个 identity；其他格式、重复或空头、压缩正文返回 HTTP 415。媒体类型检查先于正文读取。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: 请求必须使用 application/json，字符集为 UTF-8，且不压缩正文
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    CORSPreflight:
      description: 全局 OPTIONS 预检成功，HTTP 204 且无正文；支持的目标方法及头仅表示跨域策略许可，不意味着业务接口已实现。方法大小写敏感，头名称大小写不敏感，未声明请求头时可通过，显式空项和未知项拒绝。不设置 Access-Control-Max-Age，不执行 Handler 或依赖检查。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Access-Control-Allow-Origin:
          description: 与白名单完全匹配的单个请求来源，永远不使用通配符。
          schema:
            type: string
          example: http://127.0.0.1:5173
        Access-Control-Allow-Credentials:
          schema:
            type: string
            enum: ['true']
        Access-Control-Allow-Methods:
          schema:
            type: string
            enum: ['GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS']
        Access-Control-Allow-Headers:
          schema:
            type: string
            enum: ['Authorization, Content-Type, Idempotency-Key, X-CloudNest-Client, X-Request-ID']
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Vary:
          description: 至少包含 Origin、Access-Control-Request-Method、Access-Control-Request-Headers，保留其他已有区分条件；可能为多个头行。
          schema:
            type: string
    CORSForbidden:
      description: 来源或预检不被允许，HTTP 403；不返回 Access-Control 放行头，不回显原始来源、方法或头。浏览器脚本无法读取被拒响应，可在开发者工具核对状态和请求 ID。HEAD 不返回正文。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CORS_FORBIDDEN
              message: 请求来源或跨域预检不被允许
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    InternalError:
      description: 普通 panic 被恢复，或认证中间件遇到未分类内部故障、异常身份结果、取消或超时时返回 HTTP 500，不包含原始异常。响应已提交时仅中止后续处理。HEAD 响应无正文。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: 服务内部错误，请稍后重试
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RouteNotFound:
      description: 未匹配到请求方法与路径，HTTP 404；不是文件或其他业务资源不存在。无 Origin 或已允许来源的普通未注册方法沿用此响应；合法预检返回 204，来源或预检非法时优先返回 403。不自动跳转尾斜杠路径。HEAD 按 HTTP 语义不返回正文。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          description: 错误及其请求 ID 不应缓存。
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ROUTE_NOT_FOUND
              message: 未找到匹配的接口
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
  parameters:
    LoginClient:
      name: X-CloudNest-Client
      in: header
      required: true
      description: 单个精确的 web 或 native，必须与已解析正文的 client_type 一致；不去空白或转换大小写，重复/列表/空值拒绝。仅供登录操作使用。
      schema:
        type: string
        enum: [web, native]
      example: web
    LoginOrigin:
      name: Origin
      in: header
      required: false
      description: 条件规则：web 必须提供单个与白名单精确一致的来源，native 必须不带此头（显式空值/null 也拒绝）。不进行请求来源规范化或 Referer 回退，不能只凭客户端类型声明绕过规则。仅供登录操作使用。
      schema:
        type: string
      example: http://127.0.0.1:5173
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 单个标准 36 字符 UUID v4，大小写均可，合法值规范为小写；缺失、无效或重复时生成新值，不导致请求失败。用于关联请求，不作为身份或幂等凭证。
      schema:
        type: string
      example: 28ee758a-0727-42de-ae7d-3bb33155e148
  headers:
    RefreshCookie:
      description: |
        Web 模式成功响应设置 cloudnest_refresh_token，原文与内部结果一致。
        Path=/api/v1/auth，HttpOnly，SameSite=Strict，省略 Domain 以使用当前主机。
        Expires 采用会话截止时间的 UTC 整秒值。Secure 由 CLOUDNEST_COOKIE_SECURE 显式选择，HTTP 开发默认 false，HTTPS 部署配置 true。
      schema:
        type: string
    BearerChallenge:
      description: 认证拒绝的 401 响应附带 Bearer 认证提示。
      schema:
        type: string
        enum: ['Bearer realm="cloudnest"']
    RetryAfter:
      description: delta-seconds 十进制等待秒数，由正 duration 向上取整且至少为 1；防御性处理非正值时也返回 1，不采用 HTTP 日期。允许来源的普通 CORS 响应显式暴露此头。当前限流核心通常给出不超过 60 秒的建议，在途或总容量变化时不承诺到期一定放行。
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 60
    RequestID:
      description: 本次请求最终使用的 UUID v4，与请求上下文保持一致。
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      example: 28ee758a-0727-42de-ae7d-3bb33155e148
