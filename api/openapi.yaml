openapi: 3.0.3
info:
  title: CloudNest API
  version: 0.1.0
  description: |
    当前契约包含系统检查、受保护的上传创建、内容接收与任务查询、目录列表及详情、当前用户资料、会话列表及撤销接口、设备列表、改名与撤销、登录、刷新及退出操作。
    无 Origin 请求沿用原流程；有 Origin 时必须是单个与 CLOUDNEST_ALLOWED_ORIGINS 完全一致的值。
    允许来源的普通响应（包括 404/500/503）附带明确的 Access-Control-Allow-Origin、
    Access-Control-Allow-Credentials: true、Access-Control-Expose-Headers: X-Request-ID, Retry-After。
    所有响应含 Vary: Origin；OPTIONS 还区分 Access-Control-Request-Method 和 Access-Control-Request-Headers。
    OPTIONS 携带 Origin 和 Access-Control-Request-Method 时执行全局预检，不调用接口；成功响应见
    components.responses.CORSPreflight，非法来源或预检见 components.responses.CORSForbidden。
    预检不校验具体路由是否已实现，不带预检方法头的 OPTIONS 仍按普通路由匹配。
    未匹配路由的 404 见 components.responses.RouteNotFound；可恢复且响应未提交的异常见 InternalError。
    关闭自动尾斜杠跳转，例如 /ping/ 先检查来源再返回 404。路径列表不增加虚构通配或测试端点。
    JSON 读取器的共享错误见 InvalidJSONRequest、RequestBodyTooLarge、UnsupportedMediaType；
    供显式调用读取器的 JSON 操作引用，当前系统检查和资料 GET 按各自读取流程处理。
    POST /api/v1/auth/login 使用 LoginRequest 与共享输入、来源、限流及凭证错误响应。
    登录来源策略已实现：两种模式均要求单个 X-CloudNest-Client，与正文 client_type 精确一致；
    web 必须携带单个白名单 Origin，native 必须不带 Origin。来源不合规见 ClientSourceForbidden；
    LoginClient 与 LoginOrigin 记录登录、刷新及退出操作共用的头契约。
    HTTP 登录限流适配器已实现；受限响应见 RateLimited/RetryAfter 共享组件。
    登录操作共用单进程失败限流器，系统检查与当前用户 GET 使用各自处理链。
    受保护路由可挂载认证中间件，使用 BearerAuth；共享失败响应见 AuthorizationRejected 和 AccountDisabled。
    GET /api/v1/me、GET /api/v1/sessions 和 GET /api/v1/devices 已挂载认证中间件，后续业务操作按需引用这些组件。
    UserSummary 与 UserProfileData 定义用户资料的共享响应数据，用户和根目录 ID 使用十进制字符串，
    三项字节计数使用 0 到 9007199254740991 的 JSON 整数。后续登录和当前用户操作按需引用。
    当前用户接口共享成功响应见 CurrentUserProfile，响应使用 no-store。
    LoginData/LoginResponse 记录后续登录成功响应，Web JSON 省略 refresh_token，原生响应包含刷新原文。
    登录成功交付方法已通过测试入口验证，共享响应见 LoginSucceeded，Web 使用受限路径的刷新 Cookie。
    登录处理函数已在启动时绑定真实查询、共享限流凭证适配器、资料及令牌服务。
    RefreshData/RefreshResponse 定义刷新成功的数据结构，Web JSON 包含访问令牌与剩余秒数，原生模式增加刷新原文。
    刷新成功交付方法已通过测试入口验证，共享响应见 RefreshSucceeded，Web 沿用认证路径的刷新 Cookie。
    RefreshRequest 定义刷新 JSON 输入，client_type 精确选择 web/native，原生模式提交非空刷新原文。
    刷新提取按模式取得原文，Web 要求单个非空 cloudnest_refresh_token Cookie，原生使用正文值。
    刷新处理函数已组合 JSON/字段/来源检查、原文提取、刷新凭证服务与成功交付，并通过测试路由验证。
    POST /api/v1/auth/refresh 已由启动入口装配真实服务，使用共享 JWT 签发器、来源配置及 Cookie 配置。
    LogoutData/LogoutResponse 定义退出成功数据，将已确认提交的撤销结果映射为 revoked=true 和请求 ID。
    退出成功交付方法已通过测试入口验证，共享响应见 LogoutSucceeded，Web 使用相同名称及认证路径清理刷新 Cookie。
    LogoutRequest 定义退出 JSON 输入，client_type 精确选择 web/native，供后续来源检查及交付选择使用。
    退出处理函数已组合 Actor、JSON/字段/来源检查、退出服务与成功交付，并通过带认证中间件的测试路由验证。
    POST /api/v1/auth/logout 已由启动入口装配真实授权及退出服务，撤销当前会话并按客户端模式交付结果。
    UserSessionSummary/UserSessionListData/UserSessionListResponse 定义会话列表响应，使用字符串 ID、UTC 微秒时间、Current 及分页字段。
    UserSessionBeforeID/UserSessionLimit 定义会话列表操作的查询参数，默认首页和每页 50 条，输入错误使用固定字段提示。
    会话列表查询解析完整 RawQuery，额外字段采用忽略策略。整体格式错误定位 query，参数错误定位 before_id 或 limit。
    会话列表处理函数已组合 Actor、查询参数、列表服务及响应 DTO，测试专用 GET 入口的共享成功响应见 UserSessionsListed。
    GET /api/v1/sessions 已由启动入口绑定真实授权与列表服务，支持分页、当前标记及历史状态读取。
    UserSessionID 定义正式撤销指定会话操作的路径参数，使用非零 uint64 的标准十进制字符串。
    RevokeSessionData/RevokeSessionResponse 定义指定会话撤销的成功数据，使用 revoked=true 与统一 data/request_id 外层。
    指定会话撤销成功交付方法已通过测试专用 DELETE 入口验证，共享响应见 RevokeSessionSucceeded。
    指定会话撤销处理函数已组合认证 Actor、路径解析、服务及成功交付，目标不存在的共享 404 见 TargetSessionNotFound。
    DELETE /api/v1/sessions/{id} 已由启动入口绑定共享授权及已认证用户事务，支持指定当前或其他会话及重复撤销。
    UserDeviceSummary/UserDeviceListData/UserDeviceListResponse 定义后续设备列表响应，使用字符串 ID、UTC 微秒时间、current 及分页字段。
    UserDeviceBeforeID/UserDeviceLimit 定义设备列表查询参数，默认首页和每页 50 条，额外字段采用忽略策略。
    设备与会话查询共用完整 RawQuery 解析及数字校验，整体格式错误定位 query，其后依次检查 before_id、limit。
    设备列表处理函数已组合 Actor、查询参数、列表服务及响应 DTO，测试专用 GET 入口的共享成功响应见 UserDevicesListed。
    GET /api/v1/devices 已由启动入口绑定共享授权与真实设备列表服务，支持分页、当前设备标记及历史状态读取。
    RenameDeviceRequest 定义后续修改设备名称的请求正文，name 复用登录设备名称的输入规则，字段错误定位 name。
    RenamedDeviceSummary/RenameDeviceData/RenameDeviceResponse 定义后续改名成功响应，使用 data.device 与 request_id，设备时间为 UTC 微秒值。
    设备改名成功交付方法已通过测试专用 PATCH 入口验证，共享成功响应见 RenameDeviceSucceeded。
    设备改名处理函数已组合 Actor、路径、名称正文、服务及交付，目标不存在的共享 404 见 TargetDeviceNotFound。
    PATCH /api/v1/devices/{id} 已由启动入口绑定共享授权、用户事务和真实改名服务，确认提交后返回更新设备。
    RevokeDeviceData/RevokeDeviceResponse 定义后续设备撤销成功响应，使用 revoked=true 和统一 data/request_id 外层。
    设备撤销成功交付方法已通过测试专用 DELETE 入口验证，共享成功响应见 RevokeDeviceSucceeded。
    设备撤销处理函数组合 Actor、设备路径、撤销服务及交付，目标不存在复用 TargetDeviceNotFound。
    DELETE /api/v1/devices/{id} 由启动入口绑定共享授权及用户事务，原子撤销设备和全部关联会话。
    UserDeviceID 定义后续设备操作的路径参数，使用非零 uint64 的标准十进制字符串，字段错误定位 id。
    DirectoryEntrySummary/DirectoryBreadcrumb/DirectoryPageData/DirectoryPageResponse 定义后续基础目录列表响应。
    GlobalEntryPageData/GlobalEntryPageResponse 定义全局分页响应，复用条目摘要，breadcrumbs 为 []，预算空页保留 next_cursor，结束时返回 null。
    NameEntryPageData/NameEntryPageResponse 定义名称升序分页响应，条目复用基础摘要，breadcrumbs 为 []，名称游标最多 2048 字节，预算空页保留 next_cursor。
    SizeEntryPageData/SizeEntryPageResponse 定义大小降序分页响应，条目复用基础摘要，breadcrumbs 为 []，大小游标最多 1024 字节，预算空页保留 next_cursor，结束时返回 null。
    大小降序分页通过正式 GET /api/v1/entries?scope=all/starred&sort=size_desc 交付，共享响应见 SizeEntryPageListed，关联当前 request_id 并设置禁止缓存头。
    SizeEntryScope/SizeEntrySort/SizeEntrySearch/SizeEntryKind/SizeEntryCursor/SizeEntryLimit 定义大小降序查询 DTO 输入，默认 all/size_desc、每页 50 条，搜索和游标保留解码原文。
    大小降序处理函数通过正式列表入口组合认证 Actor、查询 DTO、分页服务和成功交付，输入与游标错误见 SizeEntryQueryRejected。
    名称升序分页通过正式 GET /api/v1/entries?scope=all/starred&sort=name_asc 交付，共享响应见 NameEntryPageListed，关联当前 request_id 并设置禁止缓存头。
    NameEntryScope/NameEntrySort/NameEntrySearch/NameEntryKind/NameEntryCursor/NameEntryLimit 定义名称升序查询 DTO 输入，默认 all/name_asc、每页 50 条，搜索和游标保留解码原文。
    名称升序处理函数通过正式列表入口组合认证 Actor、查询 DTO、分页服务和成功交付，输入与游标错误见 NameEntryQueryRejected。
    RecentEntrySummary/RecentEntryPageData/RecentEntryPageResponse 定义最近使用分页响应，文件摘要增加必填 last_opened_at，breadcrumbs 为 []，空页可携带游标。
    全局分页成功交付通过测试专用 GET 入口验证，共享响应见 GlobalEntryPageListed，关联当前 request_id 并设置禁止缓存头。
    最近使用分页成功交付通过测试专用 GET 入口验证，共享响应见 RecentEntryPageListed，关联当前 request_id 并设置禁止缓存头。
    RecentEntryScope/RecentEntrySort/RecentEntrySearch/RecentEntryKind/RecentEntryCursor/RecentEntryLimit 定义最近使用查询 DTO 输入，默认 recent/last_opened_desc、每页 50 条，搜索原文保留。
    最近使用处理函数通过正式 GET /api/v1/entries?scope=recent 组合认证 Actor、查询 DTO、分页服务和成功交付，输入/游标错误见 RecentEntryQueryRejected。
    GlobalEntryScope/GlobalEntrySort/GlobalEntrySearch/GlobalEntryKind/GlobalEntryCursor/GlobalEntryLimit 定义全局查询 DTO 输入，接收 all/starred，默认 all/modified_desc、每页 50 条。
    收藏查询通过正式 GET /api/v1/entries?scope=starred 验证，并与已有 PUT 收藏写入衔接。
    全局查询参数按 query、scope、sort、q、kind、cursor、limit 定位固定字段错误，搜索原文保留，额外字段沿用忽略策略。
    全局页处理函数组合认证 Actor、查询 DTO、分页服务及成功交付，输入/游标错误见 GlobalEntryQueryRejected，结果核对当前用户和请求页大小。
    目录列表使用 items、breadcrumbs、可空 next_cursor 和统一 data/request_id，ID 与 revision 为字符串。
    目录页成功交付方法通过测试专用 GET 入口验证，共享响应见 DirectoryPageListed。
    DirectoryParentID/DirectoryCursor/DirectoryLimit 定义当前目录列表输入，默认每页 50 条。
    当前查询条件为 directory、modified_desc 和空 q/kind，重复值及不匹配条件返回固定字段错误。
    目录页处理函数组合 Actor、查询 DTO、分页服务和交付，输入/游标错误见 DirectoryQueryRejected，不可见目录见 TargetEntryNotFound。
    GET /api/v1/entries 由启动入口绑定共享授权及目录/全局/最近/名称分页，scope=all/starred 且单个 sort=name_asc 进入名称分页，其余全局请求使用修改时间查询，scope=recent 进入最近分页，省略 scope 使用目录查询。
    目录、全局、最近、名称及大小分页均使用同请求只读快照及持久化主密钥派生的独立用途游标，正式共享响应见 EntryPagesListed/EntryListQueryRejected。
    EntryID 定义文件或目录操作的路径 id，路由解码后按非零 uint64 标准十进制校验。
    EntryDetailData/EntryDetailResponse 定义指定目录项的完整公开详情，kind 映射文件类别，来源设备及历史空值按实际数据返回。
    详情成功交付方法通过测试专用 GET 入口验证，共享响应见 EntryDetailRetrieved，交付 UTF-8 JSON、请求 ID 和禁止缓存头。
    详情处理函数组合 Actor、路径 DTO、详情服务及成功交付，路径错误定位 id，不可见目标复用 TargetEntryNotFound。
    GET /api/v1/entries/{id} 已由启动入口绑定共享授权与真实详情快照服务，支持文件、目录和根目录读取。
    CreateUploadRequest 定义单文件上传创建请求 DTO，必填 parent_id/name/size_bytes，可空 sha256 转换为固定摘要，声明原值交给上传服务核对。
    CreateUploadData/CreateUploadResponse 定义上传创建稳定快照，包含公开任务、SINGLE 上传方式、应用内容路径和一致的到期时间。
    CreateUploadSucceeded 定义上传创建成功的 HTTP 201 交付，稳定快照关联当前请求 ID，并采用 no-store 与 Pragma no-cache。
    UploadContentAcceptedData/UploadContentAcceptedResponse 定义上传内容接收后的 HTTP 202 响应数据。
    UploadContentAccepted 定义该成功响应的请求 ID 与禁止缓存头，供后续内容接收操作引用。
    POST /api/v1/uploads/{id}/complete 由启动入口绑定共享授权与完成确认服务，确认校验进度或返回已保存的发布结果。
    POST /api/v1/uploads/{id}/cancel 由启动入口绑定共享授权与取消受理事务，按任务状态返回 HTTP 202 或 HTTP 200。
    UploadContentTimedOut/UploadContentConflict/UploadContentTooLarge/UploadContentStorageUnavailable 定义内容接收失败时可公开的错误。
    CreateUploadRejected/CreateUploadConflict/CreateUploadTooLarge/CreateUploadQuotaExceeded 定义创建参数、幂等冲突/到期、文件声明上限和配额不足响应。
    CreateDirectoryRequest 定义创建文件夹正文，parent_id 使用字符串 ID，name 保留原始文本，color_key 可省略或为 null。
    请求解析按 parent_id、name、color_key 定位字段错误，完整名称规则由后续创建服务校验。
    IdempotencyKey 定义后续业务写请求的 Idempotency-Key 请求头，单值及字符错误定位 Idempotency-Key。
    CreatedDirectorySummary/CreateDirectoryData/CreateDirectoryResponse 定义创建成功的稳定目录快照和 data/request_id 外层。
    CreateDirectorySucceeded 定义创建成功的 HTTP 201 交付，稳定快照关联当前请求 ID，并采用 no-store 与 Pragma no-cache。
    创建处理按认证、幂等头、JSON 和字段校验、幂等服务、结果核对与交付的顺序执行。
    CreateDirectoryRejected/CreateDirectoryConflict 定义创建参数错误、名称冲突、幂等参数冲突及记录到期的公开响应。
    POST /api/v1/directories 已由启动入口绑定共享授权、用户事务、幂等创建服务及稳定结果编解码。
    RenameEntryRequest 定义目录项重命名正文，name 保留原文，expected_revision 使用非零 uint64 的标准十进制字符串。
    重命名正文按 name、expected_revision 顺序定位字段错误，客户端所见版本由已认证用户事务中的服务比对。
    EntryRevisionConflict 定义版本冲突的 HTTP 409，details.current_revision 使用字符串保留当前完整版本。
    PATCH /api/v1/entries/{id} 已由启动入口绑定共享授权、幂等重命名服务与稳定结果编解码，结果快照跨请求及重启复用。
    POST /api/v1/entries/{id}/move 已由启动入口绑定共享授权、用户事务、幂等移动服务及稳定结果编解码，结果快照跨请求及重启复用。
    SetStarredData/SetStarredResponse 定义收藏设置成功数据及 data/request_id 外层，收藏时间采用可空 UTC 微秒值。
    收藏成功交付方法通过测试专用 PUT 入口验证，共享响应见 SetStarredSucceeded，关联当前请求 ID 并禁止缓存。
    收藏处理函数按 Actor、路径、JSON/布尔状态、核心服务及成功交付组合，目标不可见复用 TargetEntryNotFound。
    PUT /api/v1/entries/{id}/star 已由启动入口绑定共享授权与收藏核心服务，用户事务确认提交后交付偏好。
    RecordAccessRequest 定义访问记录请求，purpose 须明确为 preview/open，通过测试专用 POST 入口验证输入。
    RecordAccessData/RecordAccessResponse 定义访问记录成功数据，last_opened_at 为必需 UTC 微秒时间，外层关联当前 request_id。
    访问成功交付方法通过测试专用 POST 入口验证，共享响应见 RecordAccessSucceeded，关联当前请求 ID 并禁止缓存。
    访问处理函数组合 Actor、路径、用途 DTO、核心服务及成功交付，目录目标定位 id，用途错误定位 purpose，不可见目标复用 TargetEntryNotFound。
    POST /api/v1/entries/{id}/access 已由启动入口绑定共享授权及用户事务，按 preview/open 记录文件访问，六十秒内合并并返回已存时间。
    POST /api/v1/entries/{id}/download 定义短期下载与预览授权的计划契约，返回绑定具体存储对象的 GET URL。
    POST /api/v1/entries/{id}/trash 已接入启动入口，使用预期版本及幂等键，交付回收后的快照。
    GET /api/v1/trash 定义回收站列表的计划契约，分页返回顶层回收项、原路径和保留截止时间。
    POST /api/v1/trash/{id}/restore 已接入启动入口，以预期版本执行单项恢复，同键同参可复用已保存的快照。
servers:
  - url: http://127.0.0.1:18081
tags:
  - name: Uploads
    description: 当前用户的持久上传任务。
  - name: Entries
    description: 当前用户的文件与目录元数据。
  - name: Account
    description: 当前用户身份与资料。
  - name: System
    description: 无需登录的开发探测、进程存活与依赖就绪检查。
paths:
  /api/v1/uploads:
    post:
      tags: [Uploads]
      operationId: createUpload
      summary: 在当前用户的可见目录中创建上传任务
      description: |
        Bearer JWT 和数据库授权通过后，依次解析 Idempotency-Key、受限 JSON 和上传声明。
        parent_id 使用完整标准十进制字符串，用户及来源设备取自可信 Actor。
        首期 SINGLE 支持 0～16777216 字节，sha256 可空或为 64 位十六进制声明。
        同一用户事务复查身份、目录完整路径及新增文件深度，预占空间并创建 STAGING 对象和 UPLOADING 任务。
        稳定结果与创建数据同时提交并保留八天，有效期内同键同参数返回原始 201 快照，各次交付关联当前 request_id。
        同键不同参数及记录保留期到期分别返回 IDEMPOTENCY_CONFLICT 和 IDEMPOTENCY_EXPIRED。
        成功返回 task、SINGLE、content_path 和 expires_at，任务期限按默认值在创建时计算为 24 小时。
      security:
        - BearerAuth: []
      parameters:
