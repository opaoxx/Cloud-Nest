  /api/v1/entries:
    get:
      tags: [Entries]
      operationId: listDirectoryEntries
      summary: 分页读取当前用户的目录子项、全部可见项、收藏或最近文件
      description: |
        Bearer JWT 和数据库授权通过后按完整查询分派，单个解码后 scope=all/starred 且 sort=name_asc 进入名称升序分页，sort=size_desc 进入大小降序分页，其他全局请求进入修改时间分页，scope=recent 进入最近使用分页，其余输入由目录查询 DTO 校验。
        省略 scope 时默认 directory，parent_id 必填，根目录 ID 从 GET /api/v1/me 获取，q/kind 须为空。
        directory 的父目录与祖先须属于当前用户且均为活动目录，路径及子项在同一只读快照内读取，响应包含根到当前目录的面包屑。
        all/starred/recent 支持单个有效 UTF-8 名称搜索及小写 kind 分类，保留搜索原文，parent_id 作为额外字段处理，breadcrumbs 为 []。
        starred 进一步要求当前用户在 user_entry_preferences 中对该项具有非空 starred_at，完整父链须可见。
        全局候选按当前用户、活动状态、搜索与分类查询，交付前批量检查完整祖先路径，根目录通过资料接口获取。
        directory/all/starred 的 sort 默认 modified_desc，按 modified_at、id 降序分页。all/starred 另支持单个 sort=name_asc，按数据库原始 name_key、id 双升序，另支持单个 sort=size_desc，按 file_size、id 双降序。recent 按 last_opened_at、id 降序，sort 默认 last_opened_desc。
        recent 要求当前用户具有非空 last_opened_at，返回可见活动文件及必填 UTC 微秒 last_opened_at，folder 分类返回空页。
        limit 默认 50、上限 100，候选耗尽时 next_cursor 为 null。
        全局每次最多扫描 1000 个候选，预算耗尽时允许短页或空页带 next_cursor，客户端继续使用该游标翻页。
        首次请求省略 cursor 或传空值，后续原样使用返回游标，校验用户、实际范围、排序、筛选及目录绑定。
        目录、修改时间全局、最近、名称及大小游标使用各自独立用途密钥，同一用户的有效会话可共用所属范围的游标，名称游标最多 2048 字节，其余游标最多 1024 字节，持久化签名配置重启后可继续使用。
        跨请求采用弱一致性分页，客户端按 ID 合并去重，查询条件变化时重新读取首页。
        directory 中不可见、跨账号或不存在的父目录统一返回 ENTRY_NOT_FOUND，可见文件父项定位 parent_id 输入错误。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/EntryListScope'
        - $ref: '#/components/parameters/EntryListParentID'
        - $ref: '#/components/parameters/EntryListSearch'
        - $ref: '#/components/parameters/EntryListKind'
        - $ref: '#/components/parameters/EntryListSort'
        - $ref: '#/components/parameters/EntryListCursor'
        - $ref: '#/components/parameters/DirectoryLimit'
      responses:
        '200':
          $ref: '#/components/responses/EntryPagesListed'
        '400':
          $ref: '#/components/responses/EntryListQueryRejected'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/TargetEntryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
