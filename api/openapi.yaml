  /api/v1/uploads/{id}:
    get:
      tags: [Uploads]
      operationId: getUploadTask
      summary: 查询当前用户的指定上传任务
      description: |
        Bearer JWT 和数据库授权通过后解析路径 id，使用 Actor.UserID 读取任务。
        返回十三字段公开数据，保留到期和终态事实，同账号其他设备可查询原设备创建的任务。
        任务、目录和结果 ID 使用十进制字符串，大小遵守 JSON 安全整数，时间采用 UTC 微秒。
        last_error 采用固定公开业务码和提示。缺失或跨账号目标统一返回 UPLOAD_NOT_FOUND。
        每次请求复查账号、会话及设备的授权状态，格式错误定位 id，响应使用 no-store。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UploadTaskID'
      responses:
        '200':
          $ref: '#/components/responses/UploadTaskRetrieved'
        '400':
          $ref: '#/components/responses/UploadTaskQueryRejected'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
