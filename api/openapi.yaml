          revoked: true
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RevokeSessionData:
      type: object
      additionalProperties: false
      required: [revoked]
      description: 指定目标会话已处于撤销状态，用户事务确认提交后的成功数据。
      properties:
        revoked:
          type: boolean
          enum: [true]
          description: 目标已处于撤销状态，事务已确认提交，包含重复撤销成功。
    RevokeSessionResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/RevokeSessionData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          revoked: true
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    LogoutData:
      type: object
      additionalProperties: false
      required: [revoked]
      description: 当前会话撤销确认提交后的成功数据，Web 与原生客户端共用。
      properties:
        revoked:
          type: boolean
          enum: [true]
          description: 本次会话撤销已确认提交。
    LogoutResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/LogoutData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          revoked: true
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RefreshRequest:
      description: |
        刷新请求 DTO。Web 从 Cookie 取得凭证，正文 refresh_token 可省略、为空字符串或 null。
        原生模式须在正文提供非空 refresh_token，原文交给凭证服务继续校验格式及有效性。
        client_type 后续须与单个 X-CloudNest-Client 请求头一致，并经过来源检查。
      oneOf:
        - type: object
          additionalProperties: false
          required: [client_type]
          properties:
            client_type:
              type: string
              enum: [web]
            refresh_token:
              type: string
              nullable: true
              maxLength: 0
              writeOnly: true
          example:
            client_type: web
        - type: object
          additionalProperties: false
          required: [client_type, refresh_token]
          properties:
            client_type:
              type: string
              enum: [native]
            refresh_token:
              type: string
              minLength: 1
              writeOnly: true
          example:
            client_type: native
            refresh_token: example.refresh.token
    RefreshData:
      type: object
      additionalProperties: false
      required: [access_token, expires_in]
      description: |
        已提交且签发成功的刷新结果转换后的响应数据。
        Web 模式由后续 HTTP 交付层设置刷新 Cookie，原生模式在 JSON 中交付 refresh_token。
        expires_in 按响应计算时刻取剩余完整秒数，向下取整，未来不足一秒时为 0。
        client_type 须经请求及来源校验。
      properties:
        access_token:
          $ref: '#/components/schemas/LoginData/properties/access_token'
        expires_in:
          $ref: '#/components/schemas/LoginData/properties/expires_in'
        refresh_token:
          $ref: '#/components/schemas/LoginData/properties/refresh_token'
    RefreshResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/RefreshData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          access_token: example.access.token
          expires_in: 899
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    LoginDeviceSummary:
      type: object
      additionalProperties: false
      required: [id, name, platform]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: 完整非零 uint64 设备 ID 的十进制字符串。
        name:
          type: string
          description: 数据库中实际保留的设备名称。
        platform:
          type: string
          enum: [WEB, WINDOWS, ANDROID]
    LoginSessionSummary:
      type: object
      additionalProperties: false
      required: [id, device_id, expires_at]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: 完整非零 uint64 会话 ID 的十进制字符串。
        device_id:
          $ref: '#/components/schemas/LoginDeviceSummary/properties/id'
        expires_at:
          type: string
          format: date-time
          description: UTC 会话截止时间，最多六位小数，同时约束刷新凭证期限。
    LoginData:
      type: object
      additionalProperties: false
      required: [user, root_entry_id, quota_bytes, used_bytes, reserved_bytes, access_token, expires_in, device, session]
      description: |
        登录服务及资料服务成功后的响应数据。Web JSON 省略 refresh_token，原生模式输出该字段。
        expires_in 为响应计算时刻到访问令牌截止时刻的完整剩余秒数，向下取整，未来不足一秒时为 0。
        Web 刷新 Cookie 由后续 HTTP 交付层设置，客户端类型须通过登录字段及来源策略校验。
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        root_entry_id:
          $ref: '#/components/schemas/UserProfileData/properties/root_entry_id'
        quota_bytes:
          $ref: '#/components/schemas/UserProfileData/properties/quota_bytes'
        used_bytes:
          $ref: '#/components/schemas/UserProfileData/properties/used_bytes'
        reserved_bytes:
          $ref: '#/components/schemas/UserProfileData/properties/reserved_bytes'
        access_token:
          type: string
          minLength: 1
          description: 访问令牌原文，按敏感凭证交付。
        expires_in:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        device:
          $ref: '#/components/schemas/LoginDeviceSummary'
        session:
          $ref: '#/components/schemas/LoginSessionSummary'
        refresh_token:
          type: string
          minLength: 1
          description: 仅原生模式在 JSON 中交付，Web 模式省略。
    LoginResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/LoginData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          user: {id: '1', username: root, display_name: 学习用户}
          root_entry_id: '1'
          quota_bytes: 107374182400
          used_bytes: 0
          reserved_bytes: 0
          access_token: example.access.token
          expires_in: 899
          device: {id: '3', name: 学习设备, platform: WEB}
          session: {id: '5', device_id: '3', expires_at: '2026-12-12T08:00:00Z'}
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    UserProfileResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      description: 当前用户资料的成功响应，request_id 与响应头一致。
      properties:
        data:
          $ref: '#/components/schemas/UserProfileData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, username, display_name]
      description: 用户资料服务返回的用户展示信息，账号状态由服务复查。
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: 完整非零 uint64 用户 ID 的十进制字符串。
          example: '1'
        username:
          type: string
          description: 数据库中的用户登录名，按原文返回。
          example: root
        display_name:
          type: string
          description: 按原文返回，空字符串也明确输出。
          example: 学习用户
    UserProfileData:
      type: object
      additionalProperties: false
      required: [user, root_entry_id, quota_bytes, used_bytes, reserved_bytes]
      description: |
        供后续登录资料和当前用户响应复用的数据对象，外层由具体响应提供 data 与 request_id。
        DTO 转换检查非零 ID 与各项字节数的安全范围，状态和配额一致性由资料服务及 Repository 检查。
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        root_entry_id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: 完整非零 uint64 根目录 ID 的十进制字符串。
          example: '1'
        quota_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          example: 107374182400
        used_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          example: 0
        reserved_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          example: 0
      example:
        user: {id: '1', username: root, display_name: 学习用户}
        root_entry_id: '1'
        quota_bytes: 107374182400
        used_bytes: 0
        reserved_bytes: 0
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, installation_id, device_name, platform, client_type]
      description: 登录输入字段，校验不修改原文，不查询账号或验证密码；客户端安装标识与类型不作为身份凭证。字段合格后，登录来源策略要求客户端头与 client_type 一致；web 另需白名单 Origin，native 不得带 Origin。已由 POST /api/v1/auth/login 使用。
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9_]{1,64}$'
          description: 与数据库一致的小写 ASCII 登录名，不自动去空白或转小写。
          example: root
        password:
          type: string
          minLength: 1
          maxLength: 72
          writeOnly: true
          x-max-utf8-bytes: 72
          description: 有效 UTF-8，实际长度 1～72 字节；maxLength 是字符级上界，服务端另按 UTF-8 字节复核。保留空白，不归一化；不在登录处强制注册密码强度。
        installation_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: 客户端生成并持久保存的标准小写 UUID v4，不接受其他版本或替代写法。
          example: 28ee758a-0727-42de-ae7d-3bb33155e148
        device_name:
          type: string
          minLength: 1
          maxLength: 100
          description: 1～100 个 Unicode 码点，不能全为空白或包含控制字符；允许中文和 emoji，保留原文。
          example: 学习用浏览器
        platform:
          type: string
          enum: [WEB, WINDOWS, ANDROID]
        client_type:
          type: string
          enum: [web, native]
          description: 必须与单个 X-CloudNest-Client 头精确一致；本声明不证明调用者身份。
      oneOf:
        - properties:
            client_type:
              enum: [web]
            platform:
              enum: [WEB]
        - properties:
            client_type:
              enum: [native]
            platform:
              enum: [WINDOWS, ANDROID]
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          description: 稳定的错误类别码。
        message:
          type: string
          description: 可向客户端公开的错误提示。
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: 可公开的补充信息，未提供时为 null。
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
  responses:
    TrashListQueryRejected:
      description: |
        HTTP 400，查询编码及字段错误使用 INVALID_ARGUMENT，details.field 定位 query、cursor 或 limit。
        游标签名、用户绑定或游标内部位置无效使用 INVALID_CURSOR，details.field 为 cursor。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_CURSOR
              message: 回收站分页游标无效，请重新查询
              details:
                field: cursor
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    TrashEntryRejected:
      description: |
        HTTP 400，INVALID_ARGUMENT。字段错误定位 id、Idempotency-Key 或 expected_revision。
        JSON 读取或绑定错误的 details 为 null。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TrashEntryConflict:
      description: |
        HTTP 409，REVISION_CONFLICT 表示当前可见目录项版本与预期不一致，details.current_revision 为非零 uint64 十进制字符串。
        IDEMPOTENCY_CONFLICT 表示同键不同参数。IDEMPOTENCY_EXPIRED 表示保存的记录已到期，客户端先核对目录项当前状态。
        幂等冲突的 details 为 null。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            revision_conflict:
              value:
                error:
                  code: REVISION_CONFLICT
                  message: 文件已发生变化，请刷新后重试
                  details:
                    current_revision: '4'
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            request_conflict:
              value:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: 幂等键已用于不同请求参数
                  details: null
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RestoreEntryNotFound:
      description: |
        HTTP 404，ENTRY_NOT_FOUND。目标缺失、跨账号、未处于 TRASHED，或目标及祖先已进入永久清理时，返回统一错误。
        details 为 null，固定提示为目录项不存在。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RestoreEntryConflict:
      description: |
        HTTP 409。可恢复目标的当前版本与 expected_revision 不一致时返回 REVISION_CONFLICT，details.current_revision 为非零 uint64 十进制字符串。
        同键不同参数返回 IDEMPOTENCY_CONFLICT，已保存记录到期返回 IDEMPOTENCY_EXPIRED，客户端应先核对目录项当前状态。
        无法生成合法的空闲名称返回 NAME_CONFLICT，恢复位置无法容纳目录层级返回 TARGET_UNAVAILABLE。这两类错误及幂等错误的 details 为 null。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            revision_conflict:
              value:
                error:
                  code: REVISION_CONFLICT
                  message: 文件已发生变化，请刷新后重试
                  details:
                    current_revision: '5'
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    MoveEntryRejected:
      description: |
        HTTP 400，路径、幂等头、正文参数、目的地关系、最终深度和子树规模错误使用 INVALID_ARGUMENT。
        字段错误定位 id、Idempotency-Key、target_parent_id 或 expected_revision，JSON 读取或绑定错误的 details 为 null。
        文件目的地、自身/后代关系及最终深度定位 target_parent_id，子树规模超限定位源路径 id。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_ARGUMENT
              message: 目标父目录须为文件夹
              details:
                field: target_parent_id
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    MoveEntryConflict:
      description: |
        HTTP 409，NAME_CONFLICT 表示活动名称冲突，REVISION_CONFLICT 表示预期版本不一致并携带字符串 details.current_revision。
        IDEMPOTENCY_CONFLICT 表示同键不同参数，IDEMPOTENCY_EXPIRED 表示记录到期并提示先核对已有资源状态。
        其余冲突的 details 为 null，响应使用 no-store 和 Pragma no-cache。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            revision_conflict:
              value:
                error:
                  code: REVISION_CONFLICT
                  message: 文件已发生变化，请刷新后重试
                  details:
                    current_revision: '3'
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            request_conflict:
              value:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: 幂等键已用于不同请求参数
                  details: null
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RenameEntryRejected:
      description: |
        HTTP 400，路径、幂等头与正文参数错误使用 INVALID_ARGUMENT，完整命名规则不满足使用 INVALID_NAME。
        字段校验通过 details.field 定位 id、Idempotency-Key、name 或 expected_revision，JSON 读取或绑定错误的 details 为 null。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_NAME
              message: 目录项名称不符合命名规则
              details:
                field: name
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RootEntryOperationForbidden:
      description: HTTP 403，根目录禁止重命名、移动或回收使用 ROOT_OPERATION_FORBIDDEN，账号禁用使用 ACCOUNT_DISABLED，来源拒绝使用 CORS_FORBIDDEN。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ROOT_OPERATION_FORBIDDEN
              message: 根目录不能重命名
              details: null
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RenameEntryConflict:
      description: |
        HTTP 409，NAME_CONFLICT 表示活动名称冲突，REVISION_CONFLICT 表示预期版本不一致并携带字符串 details.current_revision。
        IDEMPOTENCY_CONFLICT 表示同键不同参数，IDEMPOTENCY_EXPIRED 表示记录到期并提示先核对已有资源状态。
        其余冲突的 details 为 null，响应使用 no-store 和 Pragma no-cache。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            revision_conflict:
              value:
                error:
                  code: REVISION_CONFLICT
                  message: 文件已发生变化，请刷新后重试
                  details:
                    current_revision: '3'
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
            request_conflict:
              value:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: 幂等键已用于不同请求参数
                  details: null
                request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    EntryRevisionConflict:
      description: |
        HTTP 409，REVISION_CONFLICT，客户端预期版本与当前可见目录项版本不一致。
        固定提示为文件已发生变化，请刷新后重试。details.current_revision 为非零 uint64 的标准十进制字符串。
        版本比对与更新在同一已认证用户事务内执行，响应使用 no-store 和 Pragma no-cache。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: REVISION_CONFLICT
              message: 文件已发生变化，请刷新后重试
              details:
                current_revision: '3'
            request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    CreateUploadRejected:
      description: |
        HTTP 400，幂等头、JSON/DTO、父目录类型或深度错误使用 INVALID_ARGUMENT，完整命名不符合规则使用 INVALID_NAME。
        details.field 定位 Idempotency-Key、parent_id、name、size_bytes 或 sha256，JSON 读取/绑定错误的 details 为 null。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Pragma:
          schema:
            type: string
            enum: [no-cache]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_NAME
              message: 目录项名称不符合命名规则
