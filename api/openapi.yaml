          description: 目标设备及关联会话已处于撤销状态，事务已确认提交，包含重复撤销成功。
    RevokeDeviceResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/RevokeDeviceData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
