        退出请求 DTO。client_type 精确选择 web/native，后续与单个 X-CloudNest-Client 请求头核对并检查来源。
        当前会话身份由认证流程提供的 Actor 确定。
      properties:
        client_type:
          type: string
          enum: [web, native]
          description: 请求客户端类型，使用准确小写值。
      example:
        client_type: web
    RevokeDeviceData:
      type: object
      additionalProperties: false
      required: [revoked]
