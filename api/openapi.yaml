openapi: 3.0.3
info:
  title: CloudNest API
  version: 0.1.0
  description: 当前契约包含开发探测、存活和就绪检查接口，业务接口随后续教学步骤补充。
servers:
  - url: http://127.0.0.1:18081
tags:
  - name: System
    description: 无需登录的开发探测、进程存活与依赖就绪检查。
paths:
  /ping:
    get:
      tags: [System]
      operationId: getPing
      summary: 开发探测
      description: 保留原有响应，供本地开发工具确认 HTTP 服务可响应。
      security: []
      responses:
        '200':
          description: HTTP 服务可响应。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  message:
                    type: string
                    enum: [CloudNest API is running]
              example:
                message: CloudNest API is running
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      summary: 进程存活检查
      description: 表示 HTTP 服务可响应，请求处理不查询 MySQL 或存储；依赖可用性由后续就绪检查提供。
      security: []
      responses:
        '200':
          description: HTTP 服务可响应。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: 依赖就绪检查
      description: 每次请求重新检查 MySQL 连接和已有 MinIO 桶访问，两项检查共享最多 5 秒，任一失败立即返回未就绪。只读检查，不返回底层错误或凭证。
      security: []
      responses:
        '200':
          description: 两项依赖检查均通过。
          headers:
            Cache-Control:
              description: 不缓存就绪结果。
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
              example:
                status: ready
        '503':
          description: 任一依赖检查失败、超时或请求取消，当前未就绪。
          headers:
            Cache-Control:
              description: 不缓存就绪结果，恢复后下次请求重新检查。
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [not_ready]
              example:
                status: not_ready
