  /api/v1/uploads/{id}/content:
    put:
      tags: [Uploads]
      operationId: uploadContent
      summary: 接收当前用户的单文件上传内容
      description: |
        Bearer 授权通过后解析任务 ID，检查头部格式，并按当前用户读取已有上传任务。
        正文使用 application/octet-stream，Content-Encoding 可省略或为单个 identity。
        允许零字节文件。已知 Content-Length 须与任务声明相同，分块请求继续校验实际字节数。
        单文件上限为 16 MiB。接收前复查任务和执行租约，传输阶段总时限为 5 分钟。
        写入对象并提交校验状态后返回 202，客户端按 task_id 查询进度。超时后宜先查询现有任务状态。
        HTTP/1.x 提前返回且正文未读完时，响应后关闭本次连接。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UploadTaskID'
      requestBody:
        required: true
        description: 文件原始字节，不使用 JSON 或 multipart。零字节任务发送空正文并提供上述媒体类型。
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '202':
          $ref: '#/components/responses/UploadContentAccepted'
        '400':
          description: 路径 ID 或正文长度元数据无效，返回 INVALID_ARGUMENT。路径错误的 details.field 为 id。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            Pragma:
              schema:
                type: string
                enum: [no-cache]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/UploadTaskNotFound'
        '408':
          $ref: '#/components/responses/UploadContentTimedOut'
        '409':
          $ref: '#/components/responses/UploadContentConflict'
        '413':
          $ref: '#/components/responses/UploadContentTooLarge'
        '415':
          $ref: '#/components/responses/UploadContentUnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UploadContentChecksumMismatch'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UploadContentStorageUnavailable'
        '507':
          $ref: '#/components/responses/UploadTempSpaceExhausted'
  /api/v1/uploads/{id}/complete:
    post:
      tags: [Uploads]
      operationId: completeUpload
      summary: 确认当前用户的单文件上传完成状态
      description: |
        服务启动时绑定共享 Bearer 授权和单文件上传完成确认服务。
        1. Bearer 授权通过后解析路径 id，按当前用户归属读取任务。同账号的其他设备也可确认完成状态，MULTIPART 返回 TASK_NOT_READY。
        2. SINGLE 任务处于 VERIFYING 时返回 202 和当前快照，涵盖等待校验、执行校验和等待重试。
           COMPLETED 返回 200 和已保存的发布结果，data.result_entry_id 为已经发布的目录项 ID。
        3. CREATING、UPLOADING、COMPLETING、CANCELLING、CANCELLED、EXPIRING、EXPIRED、FAILED 返回 409 TASK_NOT_READY。
        请求无需正文或 Idempotency-Key，重复请求按任务 ID 读取当前状态。单文件内容接收提交 VERIFYING 后，校验、发布与到期推进由后台执行。
        收到 202 后可通过 GET /api/v1/uploads/{id} 查询进度。收到 409 时可用同一查询读取当前阶段和公开错误摘要。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UploadTaskID'
      responses:
        '200':
          $ref: '#/components/responses/UploadCompletionSucceeded'
        '202':
          $ref: '#/components/responses/UploadCompletionInProgress'
        '400':
          $ref: '#/components/responses/UploadTaskQueryRejected'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/UploadTaskNotFound'
        '409':
          $ref: '#/components/responses/UploadCompletionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/uploads/{id}/cancel:
    post:
      tags: [Uploads]
      operationId: cancelUpload
      summary: 取消当前用户的单文件上传任务
      description: |
        1. Bearer 授权通过后解析路径 id，按当前用户归属读取任务。同账号的其他设备也可发起取消。MULTIPART 返回 TASK_NOT_READY。
        2. SINGLE 任务已是 CANCELLING 时返回 202。已是 CANCELLED、COMPLETED、EXPIRED 或 FAILED 时返回 200 和已记录的终态。
        3. 在所属用户事务中检查其余任务。EXPIRING 或已到期且尚未开始取消的任务返回 TASK_NOT_READY。
           CREATING、UPLOADING、COMPLETING、VERIFYING 在期限内且无有效执行租约时进入 CANCELLING。有有效执行租约时返回 UPLOAD_BUSY。
        首次受理以 CANCELLING 提交为准，进入该阶段时保留预占，取消收尾时再释放。
        请求无需正文或 Idempotency-Key。重复请求沿用同一任务当前状态，已提交的取消由后续流程接续。
        202 后客户端可使用返回的 data.id 调用 GET /api/v1/uploads/{id} 查询。200 时以 data.status 判断实际终态。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UploadTaskID'
      responses:
        '200':
          $ref: '#/components/responses/UploadCancellationTerminal'
        '202':
          $ref: '#/components/responses/UploadCancellationAccepted'
        '400':
          $ref: '#/components/responses/UploadTaskQueryRejected'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/UploadTaskNotFound'
        '409':
          $ref: '#/components/responses/UploadCancellationConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/directories:
    post:
      tags: [Entries]
