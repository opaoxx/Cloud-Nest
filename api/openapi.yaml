        Bearer JWT 和数据库授权通过后解析 before_id/limit，按已认证 Actor.UserID 读取列表。
        按会话 ID 降序分页，响应使用 items/has_more，后续页取本页末项 ID 作为 before_id。
        current 表示本次请求的会话身份匹配，历史撤销、设备撤销和到期事实按查询结果返回。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UserSessionBeforeID'
        - $ref: '#/components/parameters/UserSessionLimit'
      responses:
        '200':
          $ref: '#/components/responses/UserSessionsListed'
        '400':
          description: 已认证请求的查询格式或字段错误，INVALID_ARGUMENT，details.field 为 query、before_id 或 limit。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [Account]
      operationId: logout
      summary: 撤销当前登录会话
      description: |
        Bearer 认证及数据库授权通过后，读取 client_type，检查客户端声明和请求来源，再进入用户事务撤销当前会话。
        退出目标由已认证 Actor 确定。事务提交后，该会话的访问凭证和刷新凭证受撤销状态约束。
        Web 成功响应清理刷新 Cookie，原生客户端根据成功 JSON 清理本地凭证。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/LoginClient'
        - $ref: '#/components/parameters/LoginOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/LogoutSucceeded'
        '400':
          description: 已认证请求的 JSON 读取或退出字段校验失败，INVALID_ARGUMENT，字段错误包含 details.field。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 使用 ACCOUNT_DISABLED、CLIENT_SOURCE_FORBIDDEN 或 CORS_FORBIDDEN 表达具体拒绝原因。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh:
    post:
      tags: [Account]
      operationId: refreshTokens
      summary: 轮换刷新凭证并签发访问令牌
      description: |
        使用刷新凭证及数据库会话状态完成本次认证，按 JSON/字段/来源检查、凭证提取、事务轮换和签发的顺序处理。
        Web 通过单个刷新 Cookie 提交原文，原生通过 JSON refresh_token 提交原文。
        每次成功轮换后旧刷新原文失效，客户端对刷新执行 single-flight。交付失败时按重新登录流程恢复。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/LoginClient'
        - $ref: '#/components/parameters/LoginOrigin'
        - $ref: '#/components/parameters/WebRefreshCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          $ref: '#/components/responses/RefreshSucceeded'
        '400':
          description: JSON 读取或刷新字段校验失败，INVALID_ARGUMENT，字段错误包含 details.field。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 使用 ACCOUNT_DISABLED、CLIENT_SOURCE_FORBIDDEN 或 CORS_FORBIDDEN 表达具体拒绝原因。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags: [Account]
      operationId: login
      summary: 登录并创建当前设备会话
      description: 按字段及来源校验、共享限流和凭证验证、资料查询、用户事务会话创建、令牌签发的顺序处理。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/LoginClient'
        - $ref: '#/components/parameters/LoginOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginSucceeded'
        '400':
          description: JSON 读取或登录字段校验失败，INVALID_ARGUMENT，字段校验失败包含 details.field。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 使用 ACCOUNT_DISABLED、CLIENT_SOURCE_FORBIDDEN 或 CORS_FORBIDDEN 表达具体拒绝原因。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      tags: [Account]
      operationId: getCurrentUser
      summary: 获取当前用户资料
      description: 校验 Bearer JWT 并查询账号、会话和设备状态，再读取当前用户的真实根目录与配额资料。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/CurrentUserProfile'
        '401':
          $ref: '#/components/responses/AuthorizationRejected'
        '403':
          description: 账号禁用使用 ACCOUNT_DISABLED，全局来源策略拒绝使用 CORS_FORBIDDEN。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /ping:
    get:
      tags: [System]
      operationId: getPing
      summary: 开发探测
      description: 保留原有响应，供本地开发工具确认 HTTP 服务可响应。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: HTTP 服务可响应。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  message:
                    type: string
                    enum: [CloudNest API is running]
              example:
                message: CloudNest API is running
        '403':
          $ref: '#/components/responses/CORSForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      summary: 进程存活检查
      description: 表示 HTTP 服务可响应，请求处理不查询 MySQL 或存储；依赖可用性由后续就绪检查提供。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: HTTP 服务可响应。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
        '403':
          $ref: '#/components/responses/CORSForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: 依赖就绪检查
      description: 每次请求重新检查 MySQL 连接和已有 MinIO 桶访问，两项检查共享最多 5 秒，任一失败立即返回未就绪。只读检查，不返回底层错误或凭证。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 两项依赖检查均通过。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: 不缓存就绪结果。
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
              example:
                status: ready
        '503':
          description: 任一依赖检查失败、超时或请求取消，当前未就绪。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: 不缓存就绪结果，恢复后下次请求重新检查。
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [not_ready]
              example:
                status: not_ready
        '403':
          $ref: '#/components/responses/CORSForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 单个 Authorization 头携带 Bearer 凭证，先校验 JWT，再查询并复核账号、会话及设备状态，成功后传递 Actor。
  schemas:
    EntrySourceDeviceSummary:
      type: object
      nullable: true
      additionalProperties: false
      required: [id, name]
      description: 内容发布时的来源设备，全部信息缺失时为 null，历史记录中未知的字段单独为 null。
      properties:
        id:
          type: string
          nullable: true
          pattern: '^[1-9][0-9]{0,19}$'
          description: 非零 uint64 的标准十进制字符串，上限为 18446744073709551615。
        name:
          type: string
          nullable: true
          description: 发布时名称快照，保留原始空白与空字符串。
    EntryDetailData:
      type: object
      additionalProperties: false
      required: [id, parent_id, name, kind, size_bytes, revision, created_at, modified_at, updated_at, status, extension, mime_type, color_key, content_modified_at, source_device, starred, starred_at, last_opened_at]
      description: 可见文件或目录的完整详情，公开标识及版本使用字符串，所有可空字段明确返回 null。
      properties:
        id:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
        parent_id:
          type: string
          nullable: true
          pattern: '^[1-9][0-9]{0,19}$'
          description: 非零 uint64 父目录标识，真实根目录为 null，上限为 18446744073709551615。
        name:
          type: string
          description: 目录项原始名称，真实根目录为空字符串。
        kind:
          type: string
          enum: [folder, document, image, video, audio, archive, other]
          description: DIR 为 folder，FILE 根据已保存的 category 映射。
        size_bytes:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/size_bytes'
        revision:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/revision'
        created_at:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/created_at'
        modified_at:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/modified_at'
        updated_at:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/updated_at'
        status:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/status'
        extension:
          type: string
          nullable: true
          description: 原始扩展名提示，空文本与 null 分别保留。
        mime_type:
          type: string
          nullable: true
          description: 发布时保存的内容 MIME。
        color_key:
          type: string
          nullable: true
          description: 原始文件夹颜色键。
        content_modified_at:
          type: string
          nullable: true
          format: date-time
          description: 最近内容发布时间，UTC 微秒精度，年份为 1000～9999。
        source_device:
          $ref: '#/components/schemas/EntrySourceDeviceSummary'
        starred:
          type: boolean
          description: 当且仅当 starred_at 非 null 时为 true。
        starred_at:
          type: string
          nullable: true
          format: date-time
          description: 收藏时间，UTC 微秒精度，年份为 1000～9999。
        last_opened_at:
          type: string
          nullable: true
          format: date-time
          description: 最近成功授权访问时间，UTC 微秒精度，年份为 1000～9999。
    EntryDetailResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/EntryDetailData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          id: '23'
          parent_id: '12'
          name: 学习笔记.md
          kind: document
          size_bytes: 2048
          revision: '3'
          created_at: '2026-11-15T01:30:00.123456Z'
          modified_at: '2026-11-15T02:30:00.123456Z'
          updated_at: '2026-11-15T02:30:00.123456Z'
          status: ACTIVE
          extension: md
          mime_type: text/markdown
          color_key: null
          content_modified_at: '2026-11-15T01:30:00.123456Z'
          source_device:
            id: '19'
            name: '  发布时设备 🎮  '
          starred: true
          starred_at: '2026-11-15T02:30:00.123456Z'
          last_opened_at: '2026-11-15T03:30:00.123456Z'
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    RenameEntryData:
      type: object
      additionalProperties: false
      required: [entry]
      description: >
        重命名完成时的稳定目录项快照，可在同一事务内保存到幂等结果，提交后交付。
        恢复时核对全部十八项字段，所有可空字段显式存在，来源设备对象包含 id 和 name。
        来源设备信息全部缺失时使用 null，starred 在 starred_at 非 null 时为 true，时间规范为 UTC 微秒。
      properties:
        entry:
          allOf:
            - $ref: '#/components/schemas/EntryDetailData'
            - type: object
              properties:
                parent_id:
                  $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
                name:
                  $ref: '#/components/schemas/DirectoryEntrySummary/properties/name'
          description: 普通活动文件或目录的十八项详情字段，父目录为非零标识字符串，名称非空。
    RenameEntryResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/RenameEntryData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          entry:
            id: '23'
            parent_id: '12'
            name: 学习笔记.PDF
            kind: document
            size_bytes: 2048
            revision: '4'
            created_at: '2026-11-15T01:30:00.123456Z'
            modified_at: '2026-11-16T02:30:00.123456Z'
            updated_at: '2026-11-16T02:30:00.123456Z'
            status: ACTIVE
            extension: pdf
            mime_type: text/markdown
            color_key: null
            content_modified_at: '2026-11-15T01:30:00.123456Z'
            source_device:
              id: '19'
              name: '  发布时设备 🎮  '
            starred: true
            starred_at: '2026-11-15T02:30:00.123456Z'
            last_opened_at: '2026-11-15T03:30:00.123456Z'
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    MoveEntryData:
      type: object
      additionalProperties: false
      required: [entry]
      description: >
        移动完成时的稳定目录项快照，可在同一事务内保存到幂等结果，提交后交付。
        恢复时核对全部十八项字段，所有可空字段显式存在，来源设备对象包含 id 和 name。
        来源设备信息全部缺失时使用 null，starred 在 starred_at 非 null 时为 true，时间规范为 UTC 微秒。
      properties:
        entry:
          allOf:
            - $ref: '#/components/schemas/EntryDetailData'
            - type: object
              properties:
                parent_id:
                  $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
                name:
                  $ref: '#/components/schemas/DirectoryEntrySummary/properties/name'
          description: 普通活动文件或目录的十八项详情字段，父目录为非零标识字符串，名称非空。
    MoveEntryResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/MoveEntryData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          entry:
            id: '23'
            parent_id: '14'
            name: 学习笔记.md
            kind: document
            size_bytes: 2048
            revision: '4'
            created_at: '2026-11-15T01:30:00.123456Z'
            modified_at: '2026-11-16T02:30:00.123456Z'
            updated_at: '2026-11-16T02:30:00.123456Z'
            status: ACTIVE
            extension: md
            mime_type: text/markdown
            color_key: null
            content_modified_at: '2026-11-15T01:30:00.123456Z'
            source_device:
              id: '19'
              name: '  发布时设备 🎮  '
            starred: true
            starred_at: '2026-11-15T02:30:00.123456Z'
            last_opened_at: '2026-11-15T03:30:00.123456Z'
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    DirectoryEntrySummary:
      type: object
      additionalProperties: false
      required: [id, parent_id, name, entry_type, size_bytes, revision, created_at, modified_at, updated_at, status]
      description: 目录及全局列表共用的基础目录项字段，来自同一快照的可见活动项，时间为 UTC 微秒值。
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
          description: 非零 uint64 的标准十进制字符串，上限为 18446744073709551615。
        parent_id:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
        name:
          type: string
          minLength: 1
          description: 按数据库原文返回的子项展示名称。
        entry_type:
          type: string
          enum: [FILE, DIR]
        size_bytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 文件内容大小快照，目录为 0。
        revision:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
          description: 非零 uint64 版本的标准十进制字符串。
        created_at:
          type: string
          format: date-time
          description: UTC 创建时间，最多六位小数，年份为 1000～9999。
        modified_at:
          type: string
          format: date-time
          description: UTC 业务修改时间，最多六位小数，年份为 1000～9999。
        updated_at:
          type: string
          format: date-time
          description: UTC 记录更新时间，最多六位小数，年份为 1000～9999。
        status:
          type: string
          enum: [ACTIVE]
    DirectoryBreadcrumb:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/DirectoryEntrySummary/properties/id'
        name:
          type: string
          description: 目录真实名称，根目录保留空字符串。
    GlobalEntryPageData:
      type: object
      additionalProperties: false
      required: [items, breadcrumbs, next_cursor]
      description: 全局可见分页数据，空页使用空数组，预算空页可携带下一页游标。
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DirectoryEntrySummary'
        breadcrumbs:
          type: array
          maxItems: 0
          description: 空数组表达跨目录的全局视图。
          items:
            $ref: '#/components/schemas/DirectoryBreadcrumb'
        next_cursor:
          type: string
          nullable: true
          minLength: 1
          maxLength: 1024
          description: 下一页签名游标，预算空页可返回文本，结束时明确返回 null。
      example:
        items: []
        breadcrumbs: []
        next_cursor: null
    GlobalEntryPageResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/GlobalEntryPageData'
        request_id:
          $ref: '#/components/headers/RequestID/schema'
      example:
        data:
          items: []
          breadcrumbs: []
          next_cursor: fixture-signed-global-cursor
        request_id: 28ee758a-0727-42de-ae7d-3bb33155e148
    NameEntryPageData:
      type: object
