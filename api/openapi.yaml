        名称按统一规则去首尾空白、校验并生成判重键，颜色保留省略/null、空字符串及原始文本。
        同一用户事务复查账号、设备和会话，检查父目录完整路径及创建后的 32 层深度。
        首次创建与稳定结果一起提交，结果保留八天。有效期内同键同参数返回原始 201 创建快照，同键不同参数返回 409。
        到期记录返回 IDEMPOTENCY_EXPIRED，提示先核对已有资源状态。各次交付关联当前 request_id。
      security:
