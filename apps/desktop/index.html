<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudNest</title>
  <style>
    :root { font-family: Inter, "Microsoft YaHei UI", sans-serif; color: #19354a; background: #f5f8fa; }
    main { max-width: 36rem; margin: 3vh auto; padding: 1.5rem; }
    h1 { margin: 0 0 1rem; }
    form { padding: 1.5rem; background: white; border: 1px solid #cad7df; border-radius: .75rem; }
    label { display: block; margin-bottom: .5rem; font-weight: 600; }
    input, button { box-sizing: border-box; padding: .6rem .8rem; font: inherit; border-radius: .35rem; }
    input { width: 100%; border: 1px solid #8599a7; }
    fieldset { padding: 1rem 0 0; margin: 1rem 0 0; border: 0; border-top: 1px solid #cad7df; }
    fieldset input + label { margin-top: .75rem; }
    button { margin-top: 1rem; border: 0; color: white; background: #216080; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    output { display: block; margin-top: 1rem; line-height: 1.6; }
    output:empty { display: none; }
    #fileSelection, #downloadStatus { white-space: pre-line; overflow-wrap: anywhere; }
    section { margin-top: 1.25rem; border-top: 1px solid #cad7df; }
    h2 { font-size: 1.15rem; margin: 1rem 0 0; }
    ul { list-style: none; margin: .75rem 0 0; padding: 0; }
    #directoryItems li, #uploadItems li { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; border-bottom: 1px solid #e0e8ed; padding: .65rem 0; }
    #uploadItems span { overflow-wrap: anywhere; }
    #uploadItems button { flex: none; margin: 0; }
    .upload-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .4rem; }
    #directoryItems li > :first-child { min-width: 0; overflow-wrap: anywhere; }
    #directoryItems li > :last-child { flex: none; color: #526977; }
    #directoryPath ol { display: flex; flex-wrap: wrap; gap: .35rem .6rem; list-style: none; padding: 0; margin: .8rem 0 0; }
    #directoryPath li { min-width: 0; overflow-wrap: anywhere; }
    #directoryPath [aria-current="page"] { font-weight: 600; }
    .directory-link { margin: 0; padding: 0; color: #216080; background: none; text-align: left; text-decoration: underline; }
    .download-action { margin: 0; padding: .35rem .55rem; }
  </style>
</head>
<body>
  <main>
    <h1>CloudNest</h1>
    <form autocomplete="off">
      <label for="address">服务地址</label>
      <input id="address" type="text" inputmode="url" spellcheck="false" value="http://127.0.0.1:18081">
      <button id="checkConnection" type="button">检查连接</button>
      <output id="connectionStatus" role="status" aria-live="polite"></output>
      <fieldset id="credentials">
        <label for="username">用户名</label>
        <input id="username" type="text" spellcheck="false">
        <label for="password">密码</label>
        <input id="password" type="password">
        <button type="submit">登录</button>
      </fieldset>
      <output id="loginStatus" role="status" aria-live="polite"></output>
      <button id="logoutAccount" type="button" hidden>退出账号</button>
      <section aria-label="本机文件">
        <button id="chooseFile" type="button">选择文件</button>
        <button id="saveUploadIntent" type="button" hidden disabled>保存上传意图</button>
        <output id="fileSelection" role="status" aria-live="polite"></output>
      </section>
      <section id="uploadPanel" aria-labelledby="uploadTitle" hidden>
        <h2 id="uploadTitle">上传队列</h2>
        <output id="uploadStatus" role="status" aria-live="polite"></output>
        <ul id="uploadItems" aria-label="上传任务列表"></ul>
      </section>
      <section id="directoryPanel" aria-labelledby="directoryTitle" hidden>
        <h2 id="directoryTitle">目录</h2>
        <nav id="directoryPath" aria-label="目录路径" hidden><ol></ol></nav>
        <button id="refreshDirectory" type="button">刷新目录</button>
        <output id="directoryStatus" role="status" aria-live="polite"></output>
        <output id="downloadStatus" role="status" aria-live="polite"></output>
        <button id="stageDownload" type="button" hidden>下载到临时文件</button>
        <button id="saveDownload" type="button" hidden>另存为…</button>
        <ul id="directoryItems" aria-label="目录内容"></ul>
        <button id="loadMore" type="button" hidden>加载更多</button>
      </section>
    </form>
  </main>
  <script type="module">
    import { Call } from "/wails/runtime.js";

    const form = document.querySelector("form");
    const address = document.querySelector("#address");
    const checkConnection = document.querySelector("#checkConnection");
    const connectionStatus = document.querySelector("#connectionStatus");
    const credentials = document.querySelector("#credentials");
    const username = document.querySelector("#username");
    const password = document.querySelector("#password");
    const loginStatus = document.querySelector("#loginStatus");
    const logoutAccount = document.querySelector("#logoutAccount");
    const chooseFile = document.querySelector("#chooseFile");
    const saveUploadIntent = document.querySelector("#saveUploadIntent");
    const fileSelection = document.querySelector("#fileSelection");
    const uploadPanel = document.querySelector("#uploadPanel");
    const uploadStatus = document.querySelector("#uploadStatus");
    const uploadItems = document.querySelector("#uploadItems");
    const directoryPanel = document.querySelector("#directoryPanel");
    const directoryPath = document.querySelector("#directoryPath");
    const breadcrumbs = directoryPath.querySelector("ol");
    const refreshDirectory = document.querySelector("#refreshDirectory");
    const directoryStatus = document.querySelector("#directoryStatus");
    const downloadStatus = document.querySelector("#downloadStatus");
    const stageDownload = document.querySelector("#stageDownload");
    const saveDownload = document.querySelector("#saveDownload");
    const directoryItems = document.querySelector("#directoryItems");
    const loadMore = document.querySelector("#loadMore");
    const entryRows = new Map();
    let currentDirectoryID = "";
    let nextCursor = null;
    let pendingPage = null;
    let selectionKey = "";
    let selectedDownload = null;
    let signedIn = false;
    const savedAddress = localStorage.getItem("cloudnest.serverAddress");
    if (savedAddress) address.value = savedAddress;
    address.addEventListener("input", () => {
      connectionStatus.textContent = "";
      loginStatus.textContent = "";
    });

    function setBusy(busy) {
      address.readOnly = busy || signedIn;
      checkConnection.disabled = busy;
      credentials.disabled = busy;
      for (const button of directoryPanel.querySelectorAll("button")) {
        button.disabled = busy;
      }
      for (const button of uploadItems.querySelectorAll("button")) {
        button.disabled = busy;
      }
      logoutAccount.disabled = busy;
      updateLoadMore();
      updateSaveUploadIntent();
    }

    function updateSaveUploadIntent() {
      saveUploadIntent.hidden = !signedIn;
      saveUploadIntent.disabled = checkConnection.disabled || chooseFile.disabled ||
        !signedIn || !currentDirectoryID || !selectionKey;
    }

    function updateLoadMore() {
      loadMore.hidden = nextCursor === null;
      loadMore.disabled = refreshDirectory.disabled || pendingPage !== null;
    }

    function clearDirectoryItems() {
      directoryItems.replaceChildren();
      entryRows.clear();
      nextCursor = null;
    }

    function showSignedIn(name, restored) {
      signedIn = true;
      credentials.hidden = true;
      directoryPanel.hidden = false;
      uploadPanel.hidden = false;
      logoutAccount.hidden = false;
      loginStatus.textContent = (restored ? "已恢复会话：" : "已登录：") + name;
    }

    function showSignedOut(notice) {
      signedIn = false;
      credentials.hidden = false;
      directoryPanel.hidden = true;
      uploadPanel.hidden = true;
      logoutAccount.hidden = true;
      password.value = "";
      fileSelection.textContent = "";
      selectionKey = "";
      uploadStatus.textContent = "";
      uploadItems.replaceChildren();
      currentDirectoryID = "";
      pendingPage = null;
      directoryStatus.textContent = "";
      clearDownloadSelection();
      clearDirectoryItems();
      breadcrumbs.replaceChildren();
      directoryPath.hidden = true;
      loginStatus.textContent = notice;
      updateSaveUploadIntent();
    }

    logoutAccount.addEventListener("click", async () => {
      setBusy(true);
      loginStatus.textContent = "正在退出账号…";
      try {
        const notice = await Call.ByName("main.Account.Logout");
        username.value = "";
        showSignedOut(notice);
      } catch (error) {
        loginStatus.textContent = error.message || "退出失败，请重试";
      } finally {
        setBusy(false);
      }
    });

    chooseFile.addEventListener("click", async () => {
      chooseFile.disabled = true;
      selectionKey = "";
      updateSaveUploadIntent();
      fileSelection.textContent = "正在准备文件…";
      try {
        const source = await Call.ByName("main.LocalFilePicker.SelectFile");
        selectionKey = source?.creation_key || "";
        fileSelection.textContent = source
          ? ["已选择 " + source.name, "大小 " + source.size_bytes + " B", "SHA-256 " + source.sha256].join("\n")
          : "已取消选择。";
      } catch (error) {
        fileSelection.textContent = error.message || "选择文件失败，请重试";
      } finally {
        chooseFile.disabled = false;
        updateSaveUploadIntent();
      }
    });

    function renderUploadIntents(result) {
      if (result.loginRequired) {
        showSignedOut(result.loginRequired);
        return false;
      }
      uploadItems.replaceChildren();
      for (const intent of result.items) {
        const row = document.createElement("li");
        const summary = document.createElement("span");
        summary.textContent = intent.name + " · " + intent.size_bytes + " B · 目录 " + intent.parent_id;
        row.append(summary);
        if (["PENDING_CREATE", "PENDING_REUSE", "REUSE_PENDING"].includes(intent.status)) {
          const phase = {
            PENDING_CREATE: "待创建任务",
            PENDING_REUSE: "待检查可复用内容",
            REUSE_PENDING: "复用请求待确认"
          }[intent.status];
          summary.textContent += " · " + phase;
          row.append(uploadActionButton("创建上传任务", () =>
            runUploadAction("Submit", intent.id, "正在提交上传记录…", "已创建 SINGLE 上传任务。", async (created) => {
              if (created.status === "REUSED") {
                uploadStatus.textContent = "已复用并发布文件。";
                if (currentDirectoryID) await loadDirectory(currentDirectoryID);
              } else if (created.multipart_plan) {
                uploadStatus.textContent = "已取得 Multipart 分片计划。";
              }
            })));
        } else if (intent.status === "CREATED") {
          summary.textContent += " · 待发送正文 · 任务 " + intent.task_id;
          const actions = document.createElement("div");
          actions.className = "upload-actions";
          actions.append(uploadActionButton("发送正文", () =>
            runUploadAction("SendContent", intent.id, "正在发送正文…", "正文已接收，等待查看校验结果。")),
            uploadActionButton("查看校验结果", () => checkUploadStatus(intent.id)));
          row.append(actions);
        } else if (intent.multipart_plan && ["MULTIPART_COMPLETION_PENDING", "COMPLETING", "VERIFYING"].includes(intent.status)) {
          const phase = {
            MULTIPART_COMPLETION_PENDING: "完成请求待确认",
            COMPLETING: "正在合并分片",
            VERIFYING: "正在校验文件"
          }[intent.status];
          summary.textContent += " · " + phase + " · 任务 " + intent.task_id;
          row.append(uploadActionButton("查看发布结果", () =>
            runUploadAction("CheckMultipartStatus", intent.id, "正在查询发布结果…", "", showUploadPublication)));
        } else if (intent.status === "VERIFYING") {
          summary.textContent += " · 正文已接收 · 待查看校验结果 · 任务 " + intent.task_id;
          row.append(uploadActionButton("查看校验结果", () => checkUploadStatus(intent.id)));
        } else if (intent.status === "MULTIPART_CREATED") {
          const plan = intent.multipart_plan;
          summary.textContent += " · 已取得分片计划 · 任务 " + intent.task_id +
            " · " + plan.part_count + " 片 · 标准片长 " + plan.part_size_bytes +
            " B · 末片偏移 " + plan.last_part_offset_bytes + " B · 末片大小 " + plan.last_part_size_bytes +
            " B · 已确认 " + plan.confirmed_parts + " / " + plan.part_count + " 片";
          const actions = document.createElement("div");
          actions.className = "upload-actions";
          if (plan.confirmed_parts === 0) {
            actions.append(uploadActionButton("上传第一片", () =>
              runUploadAction("SendFirstPart", intent.id, "正在上传第一片…", "第一片已确认。")));
          }
          if (plan.confirmed_parts === plan.part_count && intent.confirmed_bytes === intent.size_bytes) {
            actions.append(uploadActionButton("提交完成回执", () =>
              runUploadAction("CompleteMultipart", intent.id, "正在提交完成回执…", "", showUploadPublication)));
          }
          actions.append(uploadActionButton("核对并续传", () =>
            runUploadAction("SendRemainingParts", intent.id, "正在核对并续传分片…", "全部分片已确认。")));
          row.append(actions);
        } else if (intent.status === "REUSED") {
          summary.textContent += " · 已复用并发布 · 条目 " + intent.result_entry_id;
          if (intent.result_name !== intent.name) summary.textContent += " · " + intent.result_name;
        } else if (intent.status === "COMPLETED") {
          summary.textContent += " · 已发布 · 任务 " + intent.task_id + " · 条目 " + intent.result_entry_id;
        } else {
          const outcome = { FAILED: "上传失败", CANCELLED: "已取消", EXPIRED: "任务已过期" }[intent.status];
          summary.textContent += " · " + outcome + " · 任务 " + intent.task_id;
          if (intent.error_message) summary.textContent += " · " + intent.error_message;
          if (intent.error_code) summary.textContent += "（" + intent.error_code + "）";
        }
        if (intent.status !== "REUSED") {
          summary.textContent += " · 已确认 " + intent.confirmed_bytes + " / " + intent.size_bytes + " B";
        }
        uploadItems.append(row);
      }
      uploadStatus.textContent = result.items.length ? "" : "暂无上传记录。";
      return true;
    }

    function uploadActionButton(label, action) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.disabled = checkConnection.disabled;
      button.addEventListener("click", action);
      return button;
    }

    async function loadUploadIntents() {
      if (!signedIn) return;
      try {
        renderUploadIntents(await Call.ByName("main.UploadIntents.List"));
      } catch (error) {
        uploadStatus.textContent = error.message || "读取本机上传记录失败";
      }
    }

    async function runUploadAction(method, intentID, progress, success, afterAction) {
      if (checkConnection.disabled) return;
      setBusy(true);
      uploadStatus.textContent = progress;
      try {
        const result = await Call.ByName("main.UploadIntents." + method, intentID);
        if (renderUploadIntents(result)) {
          uploadStatus.textContent = success;
          if (afterAction) await afterAction(result.items.find(item => item.id === intentID));
        }
      } catch (error) {
        if (method === "Submit" || method === "SendRemainingParts" || method === "CompleteMultipart") await loadUploadIntents();
        if (signedIn) uploadStatus.textContent = error.message || "上传操作未确认，请重试同一条记录";
      } finally {
        setBusy(false);
      }
    }

    function checkUploadStatus(intentID) {
      return runUploadAction("CheckStatus", intentID, "正在查询校验结果…", "", showUploadPublication);
    }

    async function showUploadPublication(intent) {
      // 只在确认发布后重新读取当前目录，沿用原位置及续页失效规则。
      if (intent.status === "COMPLETED") {
        uploadStatus.textContent = "文件已发布。";
        if (currentDirectoryID) await loadDirectory(currentDirectoryID);
      } else if (intent.status === "MULTIPART_CREATED") {
        uploadStatus.textContent = "任务尚可上传，可以核对分片或提交完成回执。";
      } else if (["VERIFYING", "CREATED", "COMPLETING", "MULTIPART_COMPLETION_PENDING"].includes(intent.status)) {
        uploadStatus.textContent = "发布结果尚未确认，可以再次查看。";
      }
    }

    saveUploadIntent.addEventListener("click", async () => {
      if (saveUploadIntent.disabled) return;
      setBusy(true);
      chooseFile.disabled = true;
      uploadStatus.textContent = "正在保存…";
      try {
        const result = await Call.ByName("main.UploadIntents.Save", currentDirectoryID, selectionKey);
        if (renderUploadIntents(result)) {
          selectionKey = "";
          uploadStatus.textContent = "已保存到本机。";
        }
      } catch (error) {
        uploadStatus.textContent = error.message || "保存失败，请重试";
      } finally {
        chooseFile.disabled = false;
        setBusy(false);
      }
    });

    function directoryButton(label, id) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "directory-link";
      button.textContent = label;
      button.disabled = refreshDirectory.disabled;
      button.addEventListener("click", () => navigateTo(id));
      return button;
    }

    function downloadButton(item) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "download-action";
      button.textContent = "获取下载授权";
      button.setAttribute("aria-label", "获取下载授权 · " + item.name);
      button.addEventListener("click", () => authorizeDownload(item));
      return button;
    }

    function clearDownloadSelection() {
      selectedDownload = null;
      stageDownload.hidden = true;
      saveDownload.hidden = true;
      downloadStatus.textContent = "";
    }

    async function authorizeDownload(item) {
      if (checkConnection.disabled || !signedIn) return;
      setBusy(true);
      clearDownloadSelection();
      downloadStatus.textContent = "正在取得下载授权…";
      try {
        // 1. 发送点击时读到的修订，冲突时由用户刷新后重新选择。
        const grant = await Call.ByName("main.Account.AuthorizeDownload", item.id, item.revision);
        if (!signedIn) return;
        if (grant.loginRequired) {
          showSignedOut(grant.loginRequired);
          return;
        }
        // 2. 显示这一份授权的对象与内容身份。
        downloadStatus.textContent = [
          "已取得下载授权 · " + item.name + " · 修订 " + grant.revision,
          "对象 ID " + grant.object_id + " · 大小 " + grant.size_bytes + " B",
          "SHA-256 " + grant.sha256
        ].join("\n");
        selectedDownload = {item, objectID: grant.object_id};
        stageDownload.hidden = false;
      } catch (error) {
        if (signedIn) downloadStatus.textContent = error.message || "获取下载授权失败，请重试";
      } finally {
        setBusy(false);
      }
    }

    stageDownload.addEventListener("click", async () => {
      if (checkConnection.disabled || !signedIn || !selectedDownload) return;
      setBusy(true);
      const {item, objectID} = selectedDownload;
      downloadStatus.textContent = "正在下载并校验 " + item.name + "…";
      try {
        // 1. 将选定的条目、修订和对象一起交给 Go 暂存。
        const result = await Call.ByName("main.Account.StageDownload", item.id, item.revision, objectID);
        if (!signedIn) return;
        if (result.loginRequired) {
          showSignedOut(result.loginRequired);
          return;
        }
        // 2. Go 确认大小和摘要后才显示可保存。
        stageDownload.hidden = true;
        saveDownload.hidden = false;
        downloadStatus.textContent = [
          "已校验，可以保存 · " + item.name + " · 修订 " + result.revision,
          "对象 ID " + result.object_id + " · 大小 " + result.size_bytes + " B",
          "SHA-256 " + result.sha256
        ].join("\n");
      } catch (error) {
        if (signedIn) downloadStatus.textContent = error.message || "下载未完成，请重试";
      } finally {
        setBusy(false);
      }
    });

    saveDownload.addEventListener("click", async () => {
      if (checkConnection.disabled || !signedIn || !selectedDownload || saveDownload.hidden) return;
      setBusy(true);
      const {item, objectID} = selectedDownload;
      downloadStatus.textContent = "正在另存 " + item.name + "…";
      try {
        // 1. 使用同一条目、修订和对象交付暂存，取消选择时可再次另存。
        const path = await Call.ByName("main.DownloadSaver.Save", item.id, item.revision, objectID, item.name);
        if (!signedIn) return;
        if (path) {
          clearDownloadSelection();
          downloadStatus.textContent = "已保存 · " + path;
        } else {
          downloadStatus.textContent = "已取消另存为，仍可保存已校验的文件。";
        }
      } catch (error) {
        if (signedIn) downloadStatus.textContent = error.message || "保存未完成，请重试";
      } finally {
        setBusy(false);
      }
    });

    function renderDirectory(page, append) {
      breadcrumbs.replaceChildren();
      for (const [index, crumb] of page.breadcrumbs.entries()) {
        const part = document.createElement("li");
        if (index > 0) {
          const separator = document.createElement("span");
          separator.textContent = " / ";
          separator.setAttribute("aria-hidden", "true");
          part.append(separator);
        }
        const label = index === 0 ? "根目录" : crumb.name;
        if (index === page.breadcrumbs.length - 1) {
          part.setAttribute("aria-current", "page");
          part.append(document.createTextNode(label));
        } else {
          part.append(directoryButton(label, crumb.id));
        }
        breadcrumbs.append(part);
      }
      directoryPath.hidden = false;

      if (!append) clearDirectoryItems();
      for (const item of page.items) {
        const row = document.createElement("li");
        const isDirectory = item.entry_type === "DIR";
        const name = isDirectory ? directoryButton(item.name, item.id) : document.createElement("span");
        const details = document.createElement("span");
        name.textContent = item.name;
        details.textContent = isDirectory ? "文件夹" : "文件 · " + item.size_bytes + " B";
        row.append(name, details);
        if (!isDirectory) row.append(downloadButton(item));
        const previousRow = entryRows.get(item.id);
        if (previousRow) {
          previousRow.replaceWith(row);
        } else {
          directoryItems.append(row);
        }
        entryRows.set(item.id, row);
      }
      currentDirectoryID = page.breadcrumbs.at(-1).id;
      nextCursor = page.next_cursor;
      if (entryRows.size === 0) {
        directoryStatus.textContent = "此目录为空。";
      } else if (nextCursor !== null) {
        directoryStatus.textContent = "已显示前 " + entryRows.size + " 项。";
      } else {
        directoryStatus.textContent = append ? "已显示全部 " + entryRows.size + " 项。" : "";
      }
    }

    async function loadDirectory(targetID) {
      // 导航和刷新都让上一次续页失效，即使之后回到同一个目录。
      pendingPage = null;
      clearDownloadSelection();
      directoryStatus.textContent = "正在读取目录…";
      if (targetID === currentDirectoryID) clearDirectoryItems();
      try {
        const result = await Call.ByName("main.Account.ReadDirectory", targetID);
        if (result.loginRequired) {
          showSignedOut(result.loginRequired);
          return;
        }
        renderDirectory(result.page, false);
      } catch (error) {
        directoryStatus.textContent = error.message || "读取目录失败，请重试";
      }
    }

    async function navigateTo(targetID) {
      if (refreshDirectory.disabled) return;
      setBusy(true);
      try {
        await loadDirectory(targetID);
      } finally {
        setBusy(false);
      }
    }

    refreshDirectory.addEventListener("click", () => navigateTo(currentDirectoryID));

    loadMore.addEventListener("click", async () => {
      if (loadMore.disabled || nextCursor === null) return;
      // 1. 记录本次续页的目录 ID 和原始游标，只禁用加载更多按钮。
      const request = { directoryID: currentDirectoryID, cursor: nextCursor };
      pendingPage = request;
      updateLoadMore();
      directoryStatus.textContent = "正在加载更多…";
      try {
        const result = await Call.ByName("main.Account.ReadNextDirectoryPage", request.directoryID, request.cursor);
        // 2. 对象身份对应这一次加载，导航后不再交付旧结果。
        if (pendingPage !== request) return;
        if (result.loginRequired) {
          showSignedOut(result.loginRequired);
        } else {
          renderDirectory(result.page, true);
        }
      } catch (error) {
        if (pendingPage === request) directoryStatus.textContent = error.message || "加载更多失败，请重试";
      } finally {
        // 3. 失败时保留原游标，恢复按钮以便重试。
        if (pendingPage === request) {
          pendingPage = null;
          updateLoadMore();
        }
      }
    });

    checkConnection.addEventListener("click", async () => {
      setBusy(true);
      connectionStatus.textContent = "正在检查服务连接…";
      try {
        const serverAddress = address.value.trim();
        await Call.ByName("github.com/opaoxx/cloud-nest/pkg/client.Readiness.Check", serverAddress);
        localStorage.setItem("cloudnest.serverAddress", serverAddress);
        connectionStatus.textContent = "已连接，CloudNest 服务已就绪。";
      } catch (error) {
        connectionStatus.textContent = error.message || "连接检查失败，请重试";
      } finally {
        setBusy(false);
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (signedIn || credentials.disabled) return;
      const loginName = username.value.trim();
      if (!loginName || !password.value) {
        loginStatus.textContent = "请输入用户名和密码。";
        return;
      }
      setBusy(true);
      loginStatus.textContent = "正在登录…";
      try {
        const login = Call.ByName("main.Account.Login", address.value.trim(), loginName, password.value);
        password.value = "";
        const signedInName = await login;
        showSignedIn(signedInName, false);
        await loadDirectory("");
        await loadUploadIntents();
      } catch (error) {
        loginStatus.textContent = error.message || "登录失败，请重试";
      } finally {
        setBusy(false);
      }
    });

    async function restoreSession() {
      setBusy(true);
      loginStatus.textContent = "正在恢复会话…";
      try {
        const restored = await Call.ByName("main.Account.Restore");
        if (restored.address) address.value = restored.address;
        if (restored.username) {
          showSignedIn(restored.username, true);
          await loadDirectory("");
          await loadUploadIntents();
        } else {
          loginStatus.textContent = restored.notice || "";
        }
      } catch (error) {
        loginStatus.textContent = error.message || "无法恢复会话，请重新登录";
      } finally {
        setBusy(false);
      }
    }

    restoreSession();
  </script>
</body>
</html>
